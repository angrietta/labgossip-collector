 {"title": "Blood sugar spikes: What actually works to manage them", "link": "https://medicalxpress.com/news/2026-11-blood-sugar-spikes.html", "key": "https://medicalxpress.com/news/2026-11-blood-sugar-spikes.html", "summary": "Blood sugar, also called blood glucose, rises after eating. Seeing that rise on a wearable monitor can make an ordinary meal look worrying. But a higher reading after lunch does not, by itself, mean that something has gone wrong.", "date": "2026-11-12", "source": "MedicalXpress", "first_seen": "2026-11-12", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-11-blood-sugar-spikes.html"], "format": "SCALE", "catch": [], "score": 8, "why": ["형식 SCALE", "훅: wrong, actually"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-11-blood-sugar-spikes.html"}, {"title": "An anti-aging drug may help protect the brain before Alzheimer's symptoms begin", "link": "https://www.sciencedaily.com/releases/2026/11/261104084017.htm", "key": "https://sciencedaily.com/releases/2026/11/261104084017.htm", "summary": "A surprising new study suggests that an anti-aging drug could help protect people genetically predisposed to Alzheimer's disease. Researchers found that just four weeks of low-dose rapamycin improved brain blood flow in healthy middle-aged adults carrying the high-risk APOE4 gene variant, with women showing the strongest benefits. Because declining blood flow can occur years before Alzheimer's symptoms appear, the discovery raises hopes for preventing or delaying the disease before memory loss begins.", "date": "2026-11-06", "source": "ScienceDaily 전체", "first_seen": "2026-11-07", "facts": ["A major focus of Lin's research is the APOE4 gene variant, which is associated with a substantially increased risk of developing Alzheimer's disease later in life.", "People who carry APOE4 can experience reduced blood flow in certain areas of the brain years before they begin having noticeable memory difficulties.", "\"Alzheimer's tends to happen more in older people, especially for those with APOE4,\" Lin said.", "Before joining the University of Missouri, Lin conducted experiments involving mice that carried APOE4.", "To investigate, Lin studied healthy adults between the ages of 45 and 65, including people who carried APOE4 and others who did not.", "Brain blood flow improved among participants carrying APOE4, but the same benefit was not observed in those without the gene variant.", "Women carrying APOE4 experienced the largest improvements in brain blood flow following treatment.", "\"We also found that females with APOE4 saw the greatest improvement in brain blood flow, which is significant given that nearly two-thirds of people with Alzheimer's are women,\" she said.", "The study, \"EXPRESS: Rapamycin increases cerebral blood flow and modulates metabolic, inflammatory, and microbiome profiles in healthy middle-aged APOE4 carriers: a pilot single-arm trial\" was published in Journal of Cerebral Blood Flow & Metabolism .", "Scientists Sound the Alarm As Colorectal Cancer Reverses a 20-Year Decline A Hidden Cancer-Fighting Switch Could Supercharge the Human Immune System A Devastating Disease Is Threatening the World’s Chocolate Supply – but Scientists May Have Found the Answer Researchers Discover Earth May Have Made Its Own Water 4.5 Billion Years Ago"], "doi": ["10.1177/0271678X261490342"], "sample": [], "journal_ref": "Journal Reference : Chetan Aware, Caitlin Maria Neher, Carter Woods, Oleksandr Khegai, Alok Kumar Dwivedi, Maalavika Govindarajan, Kira Ivanich, Mehmet Kurt, David Beversdorf, Jianlin Cheng, Nathan Bresette, Taixing Cui, Priti Balchandani, Mitzi M Gonzales, Aaron C. Ericsson, Talissa A. Altes, Ai-Ling Lin. Rapamycin increases cerebral blood flow and modulates metabolic, inflammatory, and microbiom", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/11/261104084017.htm"], "format": "DOSE", "seen": "2026-11-02", "catch": [], "score": 7, "why": ["형식 DOSE", "훅: surpris", "생활소재: aging, memory, alzheimer", "이미 본 소재(2026-11-02)"]}, {"title": "Magic mushrooms rewire the brain in a way scientists didn't expect", "link": "https://www.sciencedaily.com/releases/2026/11/261104012308.htm", "key": "https://sciencedaily.com/releases/2026/11/261104012308.htm", "summary": "A surprising discovery reveals how psilocybin, the active compound in magic mushrooms, rapidly reshapes the brain by creating new neural connections and strengthening them. Researchers found that the drug behaves differently in healthy and chronically stressed mice, potentially helping repair brain circuits damaged by prolonged stress. Most intriguingly, they identified a way to trigger this brain rewiring without the behavioral response associated with psychedelic effects.", "date": "2026-11-07", "source": "ScienceDaily 전체", "first_seen": "2026-11-08", "facts": ["The research, published October 15 in Nature Neuroscience , found that psilocybin rapidly encourages brain cells to form new connections and helps those connections mature.", "During the middle of the 20th century, substances such as psilocybin and LSD attracted attention from Western researchers because of their powerful effects on perception, consciousness, and mood.", "However, scientific investigations slowed substantially after the United States passed the Controlled Substances Act in 1970, which imposed strict restrictions on these substances.", "Within just 24 hours of psilocybin administration, the researchers observed a substantial increase in newly forming dendritic spines.", "To explore this possibility, the scientists examined the role of serotonin 2A receptors (5-HT2ARs), which are proteins on the surfaces of cells that respond to chemical signals.", "The researchers focused on a group of nerve cells called Layer 5 pyramidal neurons.", "Layer 5 pyramidal neurons serve as important communication pathways that send information from the cortex to other brain regions.", "They also contain high levels of serotonin 2A receptors, making them especially relevant to understanding psilocybin's effects.", "When the researchers restored serotonin 2A receptors only in Layer 5 pyramidal neurons, psilocybin was still able to stimulate the development of new synapses and help stabilize them.", "When they removed serotonin 2A receptors specifically from Layer 5 pyramidal neurons, psilocybin lost its ability to stimulate the same structural growth of synapses."], "doi": ["10.1038/s41593-026-02490-y"], "sample": [], "journal_ref": "Journal Reference : Jacob J. Baker, Emily Kogan, Shaorong Ma, Ju Lu, Yi Zuo. 5-HT2A receptors in layer 5 pyramidal neurons mediate the neuroplastic but not the hallucinogenic effects of psilocybin . Nature Neuroscience , 2026; DOI: 10.1038/s41593-026-02490-y", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/11/261104012308.htm"], "format": "DOSE", "seen": "2026-11-02", "catch": ["동물 실험", "상관관계"], "score": 7, "why": ["형식 DOSE", "훅: surpris, didn't", "생활소재: brain, stress, mice", "이미 본 소재(2026-11-02)"]}, {"title": "Cool adaptations: How fish survive in the Antarctic Ocean", "link": "https://phys.org/news/2026-11-cool-fish-survive-antarctic-ocean.html", "key": "https://phys.org/news/2026-11-cool-fish-survive-antarctic-ocean.html", "summary": "With water temperatures as low as -1.9°C (28.6°F), the Southern Ocean is a place of extreme living conditions. A new study led by Senckenberg researchers shows how fish have adapted to Antarctic temperatures. The researchers used the Antarctic spiny plunderfish (Harpagifer antarcticus) as a model organism and, for the first time, analyzed the maternal and paternal copies of its genome separately. This allowed them to uncover mechanisms that contribute to this group of fishes' adaptation to extreme cold.", "date": "2026-11-11", "source": "Phys.org", "first_seen": "2026-11-11", "fetch_e trial evidence published by The BMJ.", "date": "2026-11-05", "source": "MedicalXpress", "first_seen": "2026-11-05", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-11-shockwave-therapy-ease-frozen-shoulder.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-11-shockwave-therapy-ease-frozen-shoulder.html"], "format": "SCALE", "catch": ["상관관계"], "score": 6, "why": ["형식 SCALE", "훅: shock"]}, {"title": "Combining HIV prevention and addiction treatment in mobile clinics could save lives", "link": "https://medicalxpress.com/news/2026-11-combining-hiv-addiction-treatment-mobile.html", "key": "https://medicalxpress.com/news/2026-11-combining-hiv-addiction-treatment-mobile.html", "summary": "Results from a clinical trial in five major United States cities show that delivering integrated HIV and substance use disorder (SUD) services using peer navigation in mobile medical units reduced all-cause deaths by 71% compared with those among participants who received peer navigation to community-based services alone. While scientists found no difference in the use of daily, oral preexposure prophylaxis (PrEP) and medication for opioid use disorder (MOUD) between the groups, the secondary outcome of reduced mortality was significant. The study is published in JAMA Psychiatry.", "date": "2026-11-05", "source": "MedicalXpress", "first_seen": "2026-11-05", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-11-combining-hiv-addiction-treatment-mobile.htm", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-11-combining-hiv-addiction-treatment-mobile.html"], "format": "SCALE", "catch": [], "score": 6, "why": ["형식 SCALE"]}, {"title": "Rapid tau spread may explain why midlife Alzheimer's progresses more rapidly", "link": "https://medicalxpress.com/news/2026-11-rapid-tau-midlife-alzheimer-rapidly.html", "key": "https://medicalxpress.com/news/2026-11-rapid-tau-midlife-alzheimer-rapidly.html", "summary": "Patients with early-onset Alzheimer's disease, whose symptoms start before age 65, have more extensive deposits of tau, a hallmark protein of the condition, compared with patients whose symptoms start at 65-plus, a new study found. What's more, tau accumulates at more than twice the rate in younger compared to older patients and spreads widely throughout the brain.", "date": "2026-11-05", "source": "MedicalXpress", "first_seen": "2026-11-05", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-11-rapid-tau-midlife-alzheimer-rapidly.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-11-rapid-tau-midlife-alzheimer-rapidly.html"], "format": "SCALE", "catch": [], "score": 6, "why": ["형식 SCALE", "생활소재: alzheimer, brain"]}, {"title": "Why do blind people and musicians hear pitch better? New research suggests they have less internal noise", "link": "https://medicalxpress.com/news/2026-11-people-musicians-pitch-internal-noise.html", "key": "https://medicalxpress.com/news/2026-11-people-musicians-pitch-internal-noise.html", "summary": "People who have lived most of their lives blind often have extraordinary hearing abilities. In new research published in the Journal of Neuroscience, my colleagues and I discovered that this ability arises from how their auditory systems are able to more consistently and reliably process sounds compared with people who aren't blind. And interestingly, sighted musicians seem to enhance their hearing through a similar mechanism.", "date": "2026-11-05", "source": "MedicalXpress", "first_seen": "2026-11-06", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-11-people-musicians-pitch-internal-noise.html", "catch_extra": [], "sources": ["MedicalXpress", "The Conversation"], "links": ["https://medicalxpress.com/news/2026-11-people-musicians-pitch-internal-noise.html", "https://theconversation.com/why-do-blind-people-and-musicians-hear-pitch-better-new-research-suggests-they-have-less-internal-noise-294114"], "format": "SCALE", "catch": [], "score": 6, "why": ["형식 SCALE", "생활소재: music", "2곳 보도"]}, {"title": "New species of ground-dwelling bird, the largest of its kind, identified in same cave as Homo floresiensis", "link": "https://phys.org/news/2026-11-species-ground-bird-largest-kind.html", "key": "https://phys.org/news/2026-11-species-ground-bird-largest-kind.html", "summary": "In 2009, researchers working in the Liang Bua cave on Flores Island came across a leg bone. The 190,000–120,000-year-old fossil was identified as a bird bone and set aside. Like many bird bones before it, it was overlooked and left to collect dust.", "date": "2026-11-09", "source": "Phys.org", "first_seen": "2026-11-09", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-species-ground-bird-largest-kind.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-species-ground-bird-largest-kind.html"], "format": "CUT", "catch": [], "score": 6, "why": ["형식 CUT", "생활소재: bird"]}, {"title": "Not a 'night owl' yet: Extraordinary bird fossil from Messel Pit suggests species still hunted by day", "link": "https://phys.org/news/2026-11-night-owl-extraordinary-bird-fossil.html", "key": "https://phys.org/news/2026-11-night-owl-extraordinary-bird-fossil.html", "summary": "An exceptionally well-preserved, approximately 47-million-year-old owl fossil from the UNESCO World Heritage Site Messel provides new clues as to when owls became nocturnal. The newly described species Masillastrix blattophaga was likely still diurnal—as indicated by an iridescent cockroach in its stomach, as well as the structure of its feathers and wing bones. In their new study, published in the journal Current Biology, the Senckenberg researchers speculate that nocturnal behavior in owls only developed between the middle and late Eocene, some 47 to 34 million years ago.", "date": "2026-11-10", "source": "Phys.org", "first_seen": "2026-11-10", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-night-owl-extraordinary-bird-fossil.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-night-owl-extraordinary-bird-fossil.html"], "format": "CUT", "catch": [], "score": 6, "why": ["형식 CUT", "생활소재: bird"]}, {"title": "Mental health app may help unemployed people find jobs, six-week trial suggests", "link": "https://phys.org/news/2026-11-mental-health-app-unemployed-people.html", "key": "https://phys.org/news/2026-11-mental-health-app-unemployed-people.html", "summary": "Losing a job can be a life-shattering experience. And when depression complicates a job search, unemployment can become a vicious cycle. Now, a Northwestern University–led clinical trial suggests a new intervention may break that cycle: a phone app, named DRIVEN, that combines weekly self-guided mental health exercises (to reduce stress and increase motivation) with job-seeking strategies.", "date": "2026-11-11", "source": "Phys.org", "first_seen": "2026-11-11", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-mental-health-app-unemployed-people.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-mental-health-app-unemployed-people.html"], "format": "SCALE", "catch": [], "score": 6, "why": ["형식 SCALE", "생활소재: phone, exercise, stress"]}, {"title": "Bennu asteroid analysis suggests unexpected origins for organics in space", "link": "https://phys.org/news/2026-11-bennu-asteroid-analysis-unexpected-space.html", "key": "https://phys.org/news/2026-11-bennu-asteroid-analysis-unexpected-space.html", "summary": "Samples from the Bennu asteroid, which is currently more than 200 million miles (322 million kilometers) from Earth, and the Murchison meteorite, which fell to Earth in 1969, both contain molecules that build proteins necessary for life. New research has found that the molecules may have formed through the same process but originated far from one another in the solar system.", "date": "2026-11-11", "source": "Phys.org", "first_seen": "2026-11-12", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-bennu-asteroid-analysis-unexpected-space.html"], "format": "CUT", "catch": [], "score": 6, "why": ["형식 CUT", "훅: unexpected"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-bennu-asteroid-analysis-unexpected-space.html"}, {"title": "Are Counter-Strike players better at decision-making? Study reveals faster brain processing in expert gamers", "link": "https://phys.org/news/2026-11-counter-players-decision-reveals-faster.html", "key": "https://phys.org/news/2026-11-counter-players-decision-reveals-faster.html", "summary": "Expert Counter-Strike players could make ideal candidates for fast-paced emergency service response jobs requiring split-second decision-making, according to a new University of Sheffield study aiming to debunk myths about video games.", "date": "2026-11-04", "source": "Phys.org", "first_seen": "2026-11-04", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-counter-players-decision-reveals-faster.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-counter-players-decision-reveals-faster.html"], "format": "", "catch": [], "score": 5, "why": ["훅: myth, debunk", "생활소재: brain"]}, {"title": "Plants' immune memory hints at new crop breeding approach", "link": "https://phys.org/news/2026-11-immune-memory-hints-crop-approach.html", "key": "https://phys.org/news/2026-11-immune-memory-hints-crop-approach.html", "summary": "A study published in Nature Communications, led by professor Jurriaan Ton and Dr. Adam Hannan Parker at the University of Sheffield, has identified mechanisms by which plants maintain and reset stress memory from past infections. This immune memory enables plants to defend themselves more effectively against harmful bacteria and mildews, which are increasingly threatening our crop and food production.", "date": "2026-11-04", "source": "Phys.org", "first_seen": "2026-11-04", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-immune-memory-hints-crop-approach.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-immune-memory-hints-crop-approach.html"], "format": "SCALE", "catch": [], "score": 5, "why": ["형식 SCALE", "생활소재: memory, stress"]}, {"title": "Tiny fossils show brittle stars gathered around a dead whale 9.5 million years ago", "link": "https://phys.org/news/2026-11-tiny-fossils-brittle-stars-dead.html", "key": "https://phys.org/news/2026-11-tiny-fossils-brittle-stars-dead.html", "summary": "Tiny skeletal plates recovered beside fossil whale bones in southern Denmark offer a rare glimpse of life around a whale carcass approximately 9.5 million years ago. Researchers have identified a new species of brittle star, Ophiura huebnerjenseni, from the Gram Clay Pit and suggest it represents the first fossil record of brittle stars associated with a whale fall.", "date": "2026-11-04", "source": "Phys.org", "first_seen": "2026-11-04", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-tiny-fossils-brittle-stars-dead.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-tiny-fossils-brittle-stars-dead.html"], "format": "CUT", "catch": ["상관관계"], "score": 5, "why": ["형식 CUT"]}, {"title": "Pulsars set first mass limits on supermassive black hole pairs in the early universe", "link": "https://phys.org/news/2026-11-pulsars-mass-limits-supermassive-black.html", "key": "https://phys.org/news/2026-11-pulsars-mass-limits-supermassive-black.html", "summary": "So far, observations by instruments including the James Webb Space Telescope have revealed the presence of surprisingly massive black holes in the early universe. Even less than a billion years after the Big Bang, some of these bodies already weighed billions of times the mass of the sun, and to date, astronomers are unclear as to how they could have grown so large so quickly.", "date": "2026-11-05", "source": "Phys.org", "first_seen": "2026-11-05", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-pulsars-mass-limits-supermassive-black.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-pulsars-mass-limits-supermassive-black.html"], "format": "WEIGH", "catch": [], "score": 5, "why": ["형식 WEIGH", "훅: surpris"]}, {"title": "Trust in influencers grows more important in predicting buying intentions over time, analysis finds", "link": "https://phys.org/news/2026-11-important-buying-intentions-analysis.html", "key": "https://phys.org/news/2026-11-important-buying-intentions-analysis.html", "summary": "A meta-analysis of empirical studies involving more than 31,000 participants has revealed the factors that affect the level of influence of so-called social media influencers. Those factors include credibility, expertise, attractiveness and perceived similarity to their followers. They are, the work shows, positively associated with the attitude of consumers toward the brands mentioned or promoted by those influencers and, in turn, their purchasing intentions. Details of the analysis are published in the International Journal of Internet Marketing and Advertising.", "date": "2026-11-05", "source": "Phys.org", "first_seen": "2026-11-05", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-important-buying-intentions-analysis.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-important-buying-intentions-analysis.html"], "format": "PRESS", "catch": ["상관관계"], "score": 5, "why": ["형식 PRESS", "생활소재: social media"]}, {"title": "A sweeter future? AI helps scientists discover new sugar substitutes", "link": "https://phys.org/news/2026-11-sweeter-future-ai-scientists-sugar.html", "key": "https://phys.org/news/2026-11-sweeter-future-ai-scientists-sugar.html", "summary": "Researchers Dr. Shayma El-Atawneh and professor Amiram Goldblum at the Hebrew University of Jerusalem have developed a new computational framework that identified 92 promising candidates for future sugar substitutes from more than 50 million chemical compounds. The study, published in the journal Food Chemistry, demonstrates how artificial intelligence and molecular modeling could accelerate the discovery of new sweeteners while helping overcome one of the industry's persistent challenges: unwanted bitter aftertastes.", "date": "2026-11-06", "source": "Phys.org", "first_seen": "2026-11-06", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-sweeter-future-ai-scientists-sugar.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-sweeter-future-ai-scientists-sugar.html"], "format": "SCALE", "catch": ["모델·시뮬레이션"], "score": 5, "why": ["형식 SCALE"]}, {"title": "New blood test claims to detect 50-plus cancers before symptoms – but there’s no evidence it can reduce your risk of dying from cancer", "link": "https://theconversation.com/new-blood-test-claims-to-detect-50-plus-cancers-before-symptoms-but-theres-no-evidence-it-can-reduce-your-risk-of-dying-from-cancer-293409", "key": "https://theconversation.com/new-blood-test-claims-to-detect-50-plus-cancers-before-symptoms-but-theres-no-evidence-it-can-reduce-your-risk-of-dying-from-cancer-293409", "summary": "Cancer isn't the leading cause of death in the United States; heart disease ranks first in that regard. But it's cancer that strikes fear into the hearts of many Americans.", "date": "2026-11-09", "source": "The Conversation", "first_seen": "2026-11-10", "facts": ["So when a blood test comes along that claims to be able to screen for over 50 cancers at once in a single blood draw before symptoms appear – as is the case for the Galleri test , by the biotech company GRAIL – it might seem like society has a Holy Grail of modern medicine at their fingertips.", "On Sept. 23, 2026, an advisory panel to the U.S.", "The Galleri test looks for DNA signals from over 50 cancers , including the 12 that account for almost two-thirds of cancer deaths in the U.S , such as lung and pancreas cancer.", "Moreover, the test has a very low false positive rate: Only about 0.5% of people who get the test are incorrectly identified as having cancer, or one person out of every 200 tests.", "In comparison, many currently recommended screening tests, such as the Cologuard stool test for colorectal cancer, have false positive rates in the 10% range .", "The PPV of the Galleri test was 52% across three annual screens , meaning over half the positive results actually led to a cancer diagnosis.", "This is good because it gives people confidence that the test is more than 50% correct.", "For context, the PPVs of most recommended screening tests – such as stool tests for colorectal cancer, mammography for breast cancer, or the HPV test for cervical cancer – are typically below 10%, meaning most positive results don’t lead to a cancer diagnosis.", "In one study of 32,000 U.S. adults age 50 and older who received a Galleri blood test, cancer was diagnosed in about 0.5% of them – 173 patients .", "Of these patients, the test correctly predicted the cancer type in 91%."], "doi": [], "sample": ["173 patients"], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation", "MedicalXpress"], "links": ["https://theconversation.com/new-blood-test-claims-to-detect-50-plus-cancers-before-symptoms-but-theres-no-evidence-it-can-reduce-your-risk-of-dying-from-cancer-293409", "https://medicalxpress.com/news/2026-11-blood-cancers-symptoms-proof-cancer.html"], "format": "CUT", "catch": ["DOI 못 찾음"], "score": 5, "why": ["형식 CUT", "2곳 보도"]}, {"title": "Paraguay’s bank collapse brought down a president – and exposed as myth the nation’s status as a ‘Dubai of South America’", "link": "https://theconversation.com/paraguays-bank-collapse-brought-down-a-president-and-exposed-as-myth-the-nations-status-as-a-dubai-of-south-america-296112", "key": "https://theconversation.com/paraguays-bank-collapse-brought-down-a-president-and-exposed-as-myth-the-nations-status-as-a-dubai-of-south-america-296112", "summary": "The collapse raises troubling questions about who benefits from financial modernization, who controls it and who bears the risks when it fails.", "date": "2026-11-09", "source": "The Conversation", "first_seen": "2026-11-10", "facts": ["It started on Nov. 3, 2026, when millions of Paraguayans trying to access the Ueno banking app found they could no longer get their money .", "Founded as a digital lender in 2021, Ueno attracted customers with mobile banking and cash-back offers.", "The central bank finally acted after accounting adjustments left Ueno’s solvency ratio below half the legal minimum.", "That included a supervisory report put out by the bank regulators in June 2026 that described roughly US$146 million in loans to three companies linked to Grupo Vázquez, Ueno’s controlling shareholder.", "In any case, Ueno’s problems were exposed in dramatic fashion on Nov. 2, when the central bank placed Ueno into resolution, a process similar to bankruptcy but managed directly by Paraguay’s central bank.", "The lender, which says it has nearly 3 million customers – about half of the country’s population – halted transactions.", "Peña, an economist by training who was elected president in 2023 and had close ties to the bank, resigned on Nov. 5.", "He was swiftly put under house arrest, charged with corruption and succeeded by his Vice President Pedro Alliana, who was sworn in to serve until 2028.", "Carlos Carvallo chaired Ueno’s predecessor bank before Peña appointed him Paraguay’s central bank president in 2023.", "Carvallo resigned on Nov. 3 and has since been charged with the same corruption crimes as Peña."], "doi": [], "sample": [], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/paraguays-bank-collapse-brought-down-a-president-and-exposed-as-myth-the-nations-status-as-a-dubai-of-south-america-296112"], "format": "PRESS", "catch": ["DOI 못 찾음"], "score": 5, "why": ["형식 PRESS", "훅: myth"]}, {"title": "5 ways countries stymie climate negotiations without actually saying ‘no’", "link": "https://theconversation.com/5-ways-countries-stymie-climate-negotiations-without-actually-saying-no-295589", "key": "https://theconversation.com/5-ways-countries-stymie-climate-negotiations-without-actually-saying-no-295589", "summary": "The methods can be subtle but effective at slowing progress, particularly when fossil fuels are involved. Here’s what to watch for as the latest global climate talks get underway.", "date": "2026-11-09", "source": "The Conversation", "first_seen": "2026-11-10", "facts": ["There’s a reason: All it takes to water down a deal during these negotiations – the 2026 U.N. climate conference started Nov. 9 – are a few voices obstructing progress, often without ever saying “no,” and all the while maintaining the appearance of being a climate leader.", "As world leaders and their negotiators meet for the latest climate talks, COP31 , in Antalya, Turkey, Nov. 9-20, you can also pick out who is obstructing progress.", "At COP29 in Baku, Azerbaijan, in 2024, wealthy countries pointed to tight budgets, pandemic debt and rising inflation as reasons they could not meet the US$1.3 trillion in assistance that developing countries were demanding .", "They instead offered $300 billion annually by 2035 as a finance target.", "The COP29 agreement itself estimated that developing countries’ climate needed $5.1 trillion to $6.8 trillion in total through 2030.", "For example, the International Institute for Sustainable Development found that governments around the world provided more than $1.2 trillion in public financial support for fossil fuels in 2024, about five times the $254 billion they provided for clean energy.", "Over the decade from 2014 to 2024, the U.S. contributed $2 billion to the Green Climate Fund, meant to support poorer countries as they adapt to climate change, while Congress simultaneously approved at least $79 billion to help foreign countries by U.S. military weapons.", "In 2004, Princeton scholars Steve Pacala and Robert Socolow proposed the “ stabilization wedge ” approach to addressing climate change.", "It slices future emissions growth into 15 strategy wedges, each representing a way to cut 1 billion tons of carbon dioxide.", "At COP26 in Glasgow, Scotland, in 2022, early drafts of the agreement called for the “phasing out” of fossil fuels."], "doi": [], "sample": ["1,400 people"], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/5-ways-countries-stymie-climate-negotiations-without-actually-saying-no-295589"], "format": "CUT", "catch": ["DOI 못 찾음"], "score": 5, "why": ["형식 CUT", "훅: actually"]}, {"title": "A Feejee Mermaid on display in Colorado may shock and intrigue – but it’s no longer considered a ‘missing link’ on the evolutionary tree", "link": "https://theconversation.com/a-feejee-mermaid-on-display-in-colorado-may-shock-and-intrigue-but-its-no-longer-considered-a-missing-link-on-the-evolutionary-tree-294775", "key": "https://theconversation.com/a-feejee-mermaid-on-display-in-colorado-may-shock-and-intrigue-but-its-no-longer-considered-a-missing-link-on-the-evolutionary-tree-294775", "summary": "Mermaids have inhabited world folklore and mythology for centuries. Ancient Babylonians worshiped Oannes, a human-fish hybrid; sirens populated Greek mythology; and fairy tales such as \"The Little Mermaid\" have made this figure a pop culture icon.", "date": "2026-11-04", "source": "The Conversation", "first_seen": "2026-11-05", "facts": ["During the 1800s, American showman P.T.", "Presented at the American Museum, run by Barnum in Manhattan from 1841 to 1865 , as “ The Greatest Curiosity in the World ” and said to have originated in the “Feejee Islands,” the creature inspired debates about science and evolution.", "A Feejee Mermaid is a type of traditional art form that originated in Japan and the East Indies more than 400 years ago.", "It came to Americans in 1842, when Barnum claimed to display a “specimen” at the American Museum in New York City.", "In the Japanese version, the lower half was a fish attached to an upper half of a monkey or made of papier-mâché.", "Barnum’s was a mixture of a monkey and a fish, but the replica on display at the Denver Museum of Nature and Science has a papier-mâché upper half.", "The Feejee Mermaid that became part of Barnum’s exhibition was created by a Japanese fisherman in the early 19th century.", "Samuel Barrett Eades, an American sailor, purchased the Feejee Mermaid and willed it to his son, who then sold it to Moses Kimball , a curator at the Boston Museum, in 1842.", "In fact, 18th-century Swedish naturalist Carl Linnaeus had left space for mermaids in the evolutionary tree .", "The Feejee Mermaid, as it blended human and animal characteristics, folklore and science, spectacle and empiricism, displays how a monstrous hoax inspired fierce intellectual debates in 19th-century America."], "doi": [], "sample": [], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation", "Phys.org"], "links": ["https://theconversation.com/a-feejee-mermaid-on-display-in-colorado-may-shock-and-intrigue-but-its-no-longer-considered-a-missing-link-on-the-evolutionary-tree-294775", "https://phys.org/news/2026-11-feejee-mermaid-display-colorado-intrigue.html"], "format": "", "seen": "2026-11-02", "catch": ["동물 실험", "DOI 못 찾음"], "score": 4, "why": ["훅: myth, shock", "생활소재: baby, fish", "2곳 보도", "이미 본 소재(2026-11-02)"]}], "status": [{"feed": "ScienceDaily 전체", "url": "https://www.sciencedaily.com/rss/all.xml", "ok": true, "items": 60, "span_days": 6}, {"feed": "ScienceDaily 별난연구", "url": "https://www.sciencedaily.com/rss/strange_offbeat.xml", "ok": true, "items": 60, "span_days": 26}, {"feed": "ScienceDaily 뇌·마음", "url": "https://www.sciencedaily.com/rss/mind_brain.xml", "ok": true, "items": 60, "span_days": 28}, {"feed": "ScienceDaily 동식물", "url": "https://www.sciencedaily.com/rss/plants_animals.xml", "ok": true, "items": 60, "span_days": 38}, {"feed": "ScienceDaily 건강", "url": "https://www.sciencedaily.com/rss/top/health.xml", "ok": true, "items": 60, "span_days": 12}, {"feed": "Phys.org", "url": "https://phys.org/rss-feed/", "ok": true, "items": 30, "span_days": 1}, {"feed": "MedicalXpress", "url": "https://medicalxpress.com/rss-feed/", "ok": true, "items": 30, "span_days": 1}, {"feed": "The Conversation", "url": "https://theconversation.com/us/articles.atom", "ok": true, "items": 50, "span_days": 8}], "weeks": ["2026-11-09", "2026-11-02", "2026-10-26", "2026-10-19"], "total": 896, "updated": "2026-11-12 03:44"};

const FORMATS = ['전체','CUT','PRESS','WEIGH','DOSE','SCALE'];
let fmt = '전체', q = '', hideSeen = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(){
  const opts = D.weeks.map(w => `<option value="${w}" ${w===D.week?'selected':''}>${w}</option>`).join('');
  document.getElementById('sub').innerHTML =
    `${D.week} 주 · ${D.updated} 갱신 · 최근 8일 ${D.total}건 → 상위 ${D.items.length}건 · 지난 주 보기 <select id="wk">${opts}</select>`;
  document.getElementById('wk').onchange = e => {
    const w = e.target.value; location.href = w === D.weeks[0] ? BASE + 'index.html' : BASE + 'weeks/' + w + '.html';
  };
  const bar = document.getElementById('bar');
  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>
    (fmt==='전체' || g.format===fmt) && (!hideSeen || !g.seen) &&
    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
</body>
</html>
