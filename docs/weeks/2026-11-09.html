entists discover a common sugar may help cancer cells break free and spread", "link": "https://www.sciencedaily.com/releases/2026/11/261111221501.htm", "key": "https://sciencedaily.com/releases/2026/11/261111221501.htm", "summary": "Scientists have uncovered a surprising way that fructose, a sugar commonly found in sweetened foods and drinks, may help aggressive ovarian cancer spread. Researchers discovered that cancer cells surviving chemotherapy release fructose that weakens the bonds holding neighboring tumor cells together, making it easier for cancer to spread. High dietary fructose levels and cholesterol-lowering statins also produced concerning effects in preclinical experiments.", "date": "2026-11-12", "source": "ScienceDaily 전체", "first_seen": "2026-11-13", "facts": ["This spread, known as metastasis, is responsible for approximately 90% of ovarian cancer deaths.", "Fructose consumption is particularly relevant in the United States, where high fructose corn syrup can account for approximately 8% to 20% of daily calorie intake in some individuals.", "Approximately 39 million people in the United States take statins.", "NASA Warns a Monster El Niño Could Surpass the Historic 1997 Event “This Should Not Happen”: Scientists Discover a Strange New Way To Control Atoms Massive Study of 2.8 Million People Reveals New Secrets of Alzheimer’s Disease An Ancient Virus May Hold the Secret to What Makes the Human Brain Different"], "doi": ["10.1038/s43587-026-01172-5"], "sample": [], "journal_ref": "Journal Reference : Aidan R. Cole, Raquel Buj, Apoorva Uboveja, Evan Levasseur, Alexander Tom, Hui Wang, Katarzyna M. Kedziora, Adam Chatoff, Andrea Andress Huacachino, Mariola M. Marcinkiewicz, Amandine Amalric, Baixue Yang, Naveen Kumar Tangudu, Emily Noonan, Jeff Danielson, Miho Naruse, Amal Taher Elhaw, Sierra White, Danyang Li, Callen T. Wallace, Frederick Keeney, Felicia Lazure, Esther Elish", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sc : Forbidden for url: https://phys.org/news/2026-11-fish-pregnancy-unexpected-evidence-food.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-fish-pregnancy-unexpected-evidence-food.html"], "format": "PRESS", "catch": ["동물 실험"], "score": 8, "why": ["형식 PRESS", "훅: unexpected", "생활소재: baby, babies, fish"]}, {"title": "Republican gerrymandering worked pretty well in Texas and Florida, even if it backfired in North Carolina and Ohio", "link": "https://theconversation.com/republican-gerrymandering-worked-pretty-well-in-texas-and-florida-even-if-it-backfired-in-north-carolina-and-ohio-295944", "key": "https://theconversation.com/republican-gerrymandering-worked-pretty-well-in-texas-and-florida-even-if-it-backfired-in-north-carolina-and-ohio-295944", "summary": "With massive Democratic majorities poised to enter the 120th Congress, did Republican attempts to gerrymander actually end up costing them some seats in the US House? The answer is complicated.", "date": "2026-11-13", "source": "The Conversation", "first_seen": "2026-11-14", "facts": ["During the 2026 election cycle, Republicans enacted a series of gerrymanders – a form of partisan redistricting – in a handful of states to give them a disproportionate edge over Democrats in their congressional delegations.", "This unintended consequence is often referred to as a “dummymander .” So, with such massive Democratic majorities poised to enter the 120th Congress, did Republican attempts to gerrymander actually end up costing them some seats in the U.S.", "Republican state legislatures in Ohio and North Carolina redrew their congressional maps in 2025 , crafting a set of districts they believed would maximize the number of seats they could win in the House.", "Despite both states being traditionally competitive in statewide elections, their state legislatures drew a collection of seats Republicans believed they would win: 12 of these 15 new seats in Ohio and 11 out of 14 in North Carolina included a majority of voters who voted for Donald Trump in the 2024 presidential election.", "But in 2026, Democrats across the country won dozens of seats that had previously seemed out of reach, including districts Trump won by double digits in 2024.", "In Ohio and North Carolina, the size and scope of the midterm backlash against Trump and his party put many of the seats Republicans targeted in these states, including ones Trump won by as many as 20 points, in serious jeopardy.", "Texas and Florida also targeted a series of Democrat-held seats to flip their way in 2026.", "Shomari Figures in Alabama, were the targets of gerrymanders that created new districts that Trump won in 2024, all by 9 percentage points or more.", "But once the 2026 Democratic wave swept through the deep South, these gerrymanders were essentially canceled out.", "Despite the gains the party projected, Republicans in these three states appear likely to enter the 120th Congress with delegations the same size as they had in the 119th."], "doi": [], "sample": [], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/republican-gerrymandering-worked-pretty-well-in-texas-and-florida-even-if-it-backfired-in-north-carolina-and-ohio-295944"], "format": "WEIGH", "catch": ["DOI 못 찾음"], "score": 8, "why": ["형식 WEIGH", "훅: backfire, actually"]}, {"title": "Cool adaptations: How fish survive in the Antarctic Ocean", "link": "https://phys.org/news/2026-11-cool-fish-survive-antarctic-ocean.html", "key": "https://phys.org/news/2026-11-cool-fish-survive-antarctic-ocean.html", "summary": "With water temperatures as low as -1.9°C (28.6°F), the Southern Ocean is a place of extreme living conditions. A new study led by Senckenberg researchers shows how fish have adapted to Antarctic temperatures. The researchers used the Antarctic spiny plunderfish (Harpagifer antarcticus) as a model organism and, for the first time, analyzed the maternal and paternal copie to detect 50-plus cancers before symptoms – but there’s no evidence it can reduce your risk of dying from cancer", "link": "https://theconversation.com/new-blood-test-claims-to-detect-50-plus-cancers-before-symptoms-but-theres-no-evidence-it-can-reduce-your-risk-of-dying-from-cancer-293409", "key": "https://theconversation.com/new-blood-test-claims-to-detect-50-plus-cancers-before-symptoms-but-theres-no-evidence-it-can-reduce-your-risk-of-dying-from-cancer-293409", "summary": "Cancer isn't the leading cause of death in the United States; heart disease ranks first in that regard. But it's cancer that strikes fear into the hearts of many Americans.", "date": "2026-11-09", "source": "The Conversation", "first_seen": "2026-11-10", "facts": ["So when a blood test comes along that claims to be able to screen for over 50 cancers at once in a single blood draw before symptoms appear – as is the case for the Galleri test , by the biotech company GRAIL – it might seem like society has a Holy Grail of modern medicine at their fingertips.", "On Sept. 23, 2026, an advisory panel to the U.S.", "The Galleri test looks for DNA signals from over 50 cancers , including the 12 that account for almost two-thirds of cancer deaths in the U.S , such as lung and pancreas cancer.", "Moreover, the test has a very low false positive rate: Only about 0.5% of people who get the test are incorrectly identified as having cancer, or one person out of every 200 tests.", "In comparison, many currently recommended screening tests, such as the Cologuard stool test for colorectal cancer, have false positive rates in the 10% range .", "The PPV of the Galleri test was 52% across three annual screens , meaning over half the positive results actually led to a cancer diagnosis.", "This is good because it gives people confidence that the test is more than 50% correct.", "For context, the PPVs of most recommended screening tests – such as stool tests for colorectal cancer, mammography for breast cancer, or the HPV test for cervical cancer – are typically below 10%, meaning most positive results don’t lead to a cancer diagnosis.", "In one study of 32,000 U.S. adults age 50 and older who received a Galleri blood test, cancer was diagnosed in about 0.5% of them – 173 patients .", "Of these patients, the test correctly predicted the cancer type in 91%."], "doi": [], "sample": ["173 patients"], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation", "MedicalXpress"], "links": ["https://theconversation.com/new-blood-test-claims-to-detect-50-plus-cancers-before-symptoms-but-theres-no-evidence-it-can-reduce-your-risk-of-dying-from-cancer-293409", "https://medicalxpress.com/news/2026-11-blood-cancers-symptoms-proof-cancer.html"], "format": "CUT", "catch": ["DOI 못 찾음"], "score": 5, "why": ["형식 CUT", "2곳 보도"]}, {"title": "Paraguay’s bank collapse brought down a president – and exposed as myth the nation’s status as a ‘Dubai of South America’", "link": "https://theconversation.com/paraguays-bank-collapse-brought-down-a-president-and-exposed-as-myth-the-nations-status-as-a-dubai-of-south-america-296112", "key": "https://theconversation.com/paraguays-bank-collapse-brought-down-a-president-and-exposed-as-myth-the-nations-status-as-a-dubai-of-south-america-296112", "summary": "The collapse raises troubling questions about who benefits from financial modernization, who controls it and who bears the risks when it fails.", "date": "2026-11-09", "source": "The Conversation", "first_seen": "2026-11-10", "facts": ["It started on Nov. 3, 2026, when millions of Paraguayans trying to access the Ueno banking app found they could no longer get their money .", "Founded as a digital lender in 2021, Ueno attracted customers with mobile banking and cash-back offers.", "The central bank finally acted after accounting adjustments left Ueno’s solvency ratio below half the legal minimum.", "That included a supervisory report put out by the bank regulators in June 2026 that described roughly US$146 million in loans to three companies linked to Grupo Vázquez, Ueno’s controlling shareholder.", "In any case, Ueno’s problems were exposed in dramatic fashion on Nov. 2, when the central bank placed Ueno into resolution, a process similar to bankruptcy but managed directly by Paraguay’s central bank.", "The lender, which says it has nearly 3 million customers – about half of the country’s population – halted transactions.", "Peña, an economist by training who was elected president in 2023 and had close ties to the bank, resigned on Nov. 5.", "He was swiftly put under house arrest, charged with corruption and succeeded by his Vice President Pedro Alliana, who was sworn in to serve until 2028.", "Carlos Carvallo chaired Ueno’s predecessor bank before Peña appointed him Paraguay’s central bank president in 2023.", "Carvallo resigned on Nov. 3 and has since been charged with the same corruption crimes as Peña."], "doi": [], "sample": [], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/paraguays-bank-collapse-brought-down-a-president-and-exposed-as-myth-the-nations-status-as-a-dubai-of-south-america-296112"], "format": "PRESS", "catch": ["DOI 못 찾음"], "score": 5, "why": ["형식 PRESS", "훅: myth"]}, {"title": "5 ways countries stymie climate negotiations without actually saying ‘no’", "link": "https://theconversation.com/5-ways-countries-stymie-climate-negotiations-without-actually-saying-no-295589", "key": "https://theconversation.com/5-ways-countries-stymie-climate-negotiations-without-actually-saying-no-295589", "summary": "The methods can be subtle but effective at slowing progress, particularly when fossil fuels are involved. Here’s what to watch for as the latest global climate talks get underway.", "date": "2026-11-09", "source": "The Conversation", "first_seen": "2026-11-10", "facts": ["There’s a reason: All it takes to water down a deal during these negotiations – the 2026 U.N. climate conference started Nov. 9 – are a few voices obstructing progress, often without ever saying “no,” and all the while maintaining the appearance of being a climate leader.", "As world leaders and their negotiators meet for the latest climate talks, COP31 , in Antalya, Turkey, Nov. 9-20, you can also pick out who is obstructing progress.", "At COP29 in Baku, Azerbaijan, in 2024, wealthy countries pointed to tight budgets, pandemic debt and rising inflation as reasons they could not meet the US$1.3 trillion in assistance that developing countries were demanding .", "They instead offered $300 billion annually by 2035 as a finance target.", "The COP29 agreement itself estimated that developing countries’ climate needed $5.1 trillion to $6.8 trillion in total through 2030.", "For example, the International Institute for Sustainable Development found that governments around the world provided more than $1.2 trillion in public financial support for fossil fuels in 2024, about five times the $254 billion they provided for clean energy.", "Over the decade from 2014 to 2024, the U.S. contributed $2 billion to the Green Climate Fund, meant to support poorer countries as they adapt to climate change, while Congress simultaneously approved at least $79 billion to help foreign countries by U.S. military weapons.", "In 2004, Princeton scholars Steve Pacala and Robert Socolow proposed the “ stabilization wedge ” approach to addressing climate change.", "It slices future emissions growth into 15 strategy wedges, each representing a way to cut 1 billion tons of carbon dioxide.", "At COP26 in Glasgow, Scotland, in 2022, early drafts of the agreement called for the “phasing out” of fossil fuels."], "doi": [], "sample": ["1,400 people"], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/5-ways-countries-stymie-climate-negotiations-without-actually-saying-no-295589"], "format": "CUT", "catch": ["DOI 못 찾음"], "score": 5, "why": ["형식 CUT", "훅: actually"]}, {"title": "Comp const BASE = location.pathname.includes('/weeks/') ? '../' : '';
const FORMATS = ['전체','CUT','PRESS','WEIGH','DOSE','SCALE'];
let fmt = '전체', q = '', hideSeen = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(){
  const opts = D.weeks.map(w => `<option value="${w}" ${w===D.week?'selected':''}>${w}</option>`).join('');
  document.getElementById('sub').innerHTML =
    `${D.week} 주 · ${D.updated} 갱신 · 최근 8일 ${D.total}건 → 상위 ${D.items.length}건 · 지난 주 보기 <select id="wk">${opts}</select>`;
  document.getElementById('wk').onchange = e => {
    const w = e.target.value; location.href = w === D.weeks[0] ? BASE + 'index.html' : BASE + 'weeks/' + w + '.html';
  };
  const bar = document.getElementById('bar');
  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>
    (fmt==='전체' || g.format===fmt) && (!hideSeen || !g.seen) &&
    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
</body>
</html>
