n people worldwide and generating annual costs exceeding $800 billion.", "The number of people living with the condition is expected to double by 2050.", "More than 400 clinical trials have investigated potential Alzheimer's drugs, with most focusing on amyloid beta.", "Researchers have concentrated particularly on two versions, Aβ40 and Aβ42, which contain 40 and 42 amino acids, respectively.", "Aβ42 has attracted the greatest attention because it is especially prone to sticking together and forming toxic aggregates.", "\"We need fundamentally new approaches to the problem.\" Unlike amyloid beta, P3 forms when Amyloid Precursor Protein is processed through a different sequence of molecular cuts."], "sample": []}, {"title": "Rare study reveals a striking divide inside an Alzheimer’s patient’s brain", "link": "https://www.sciencedaily.com/releases/2026/10/261013015814.htm", "key": "https://sciencedaily.com/releases/2026/10/261013015814.htm", "summary": "A rare examination of an Alzheimer’s patient’s brain revealed that regions cleared of amyloid plaques had remarkably little of the harmful tau buildup associated with memory loss, while neighboring areas showed extensive damage. The discovery suggests that removing amyloid may have lasting protective effects and could help slow Alzheimer’s progression, especially when treatment begins early.", "date": "2026-10-15", "source": "ScienceDaily 뇌·마음", "first_seen": "2026-10-22", "sources": ["ScienceDaily 뇌·마음"], "links": ["https://www.sciencedaily.com/releases/2026/10/261013015814.htm"], "format": "CUT", "catch": ["상관관계", "세포·시험관"], "score": 8, "why": ["형식 CUT", "생활소재: memory, alzheimer, brain"], "doi": ["10.1001/jama.2026.13058"], "journal_ref": "Journal Reference : Christopher A. Brown, John L. Robinson, Sandhitsu R. Das, Emily McGrew, EunRan Suh, Viviana M. Van Deerlin, David J. Irwin, Ilya M. Nasrallah, Dawn Mechanic-Hamilton, Paul A. Yushkevich, David A. Wolk, Edward B. Lee. Clinicopathologic Evaluation of Amyloid Clearance in Alzheimer Disease . JAMA , 2026; DOI: 10.1001/jama.2026.13058", "facts": ["Researchers from the Perelman School of Medicine at the University of Pennsylvania presented the findings at the 2026 Alzheimer's Association International Conference.", "He subsequently joined a clinical trial testing aducanumab and received 30 doses of the medication over four and a half years.", "Clinical trials commonly evaluate patients over approximately 18 months, but some protective effects might take considerably longer to become apparent.", "Ongoing trials will help determine whether starting treatment before symptoms begin can provide even greater benefit.\" This research received support from the National Institutes of Health (P30-AG072979, RF1-AG069474, R01-AG056014, R01-AG055005, R01-AG072796, R01-AG065341, P01-AG084497).", "Scientists Discover a Potential Early Warning Sign of Alzheimerâs in Adults As Young as 45 40 Years of Superconductor Science Just Got Turned Upside Down by a Stunning Discovery"], "sample": []}, {"title": "Cornell scientists identify rare human genetic disorder in two unusually long-legged cats", "link": "https://www.sciencedaily.com/releases/2026/10/261013015801.htm", "key": "https://sciencedaily.com/releases/2026/10/261013015801.htm", "summary": "Two unusually long-legged cats have helped scientists uncover the first genetically confirmed cases of Marfan syndrome in domestic felines. Researchers at Cornell University discovered that the brothers carried two altered copies of a gene linked to the rare connective tissue disorder, which can affect the eyes, heart, and blood vessels. Surprisingly, the cats survived into adulthood because their genetic mutation still allowed some normal function.", "date": "2026-10-14", "source": "ScienceDaily 동식물", "first_seen": "2026-10-22", "sources": ["ScienceDaily 동식물"], "links": ["https://www.sciencedaily.com/releases/2026/10/261013015801.htm"], "format": "CUT", "catch": ["상관관계"], "score": 8, "why": ["형식 CUT", "훅: surpris", "생활소재: cat"], "doi": ["10.1038/s41598-026-70702-3"], "journal_ref": "Journal Reference : Shawna R. Cook, Jessica J. Hayward, Soon Hon Cheong, Linda Impe, Ian R. Porter, Brian Lamendola, Gavin R. Hitchener, Urs Giger, Philip R. Fox, Jacquelyn M. Evans, Bart J. G. Broeckx. A homozygous hypomorphic FBN1 splice region variant in domestic cats with Marfan syndrome . Scientific Reports , 2026; DOI: 10.1038/s41598-026-70702-3", "facts": ["The disorder affects approximately 1 in 4,000 people, but these brothers represented the first known documented feline cases.", "Their investigation identified changes in a gene called FBN1 , which provides instructions for producing fibrillin-1.", "Genetic testing revealed that Gary and Shaggy each had two altered copies of FBN1 , having inherited one from each parent.", "Having two altered copies is exceptionally uncommon and can severely disrupt the production of normal fibrillin-1.", "Scientists Discover a Potential Early Warning Sign of Alzheimerâs in Adults As Young as 45 40 Years of Superconductor Science Just Got Turned Upside Down by a Stunning Discovery"], "sample": ["4,000 people"]}, {"title": "Ozempic and Wegovy linked to rare risk of sudden vision loss", "link": "https://www.sciencedaily.com/releases/2026/10/261014015521.htm", "key": "https://sciencedaily.com/releases/2026/10/261014015521.htm", "summary": "Popular diabetes and weight loss drugs such as Ozempic and Wegovy have been linked to a slightly increased risk of a rare condition that can cause sudden, potentially permanent vision loss. Although the risk remains very low, Rutgers researchers say the findings warrant attention as millions of people turn to GLP-1 medications.", "date": "2026-10-15", "source": "ScienceDaily 건강", "first_seen": "2026-10-22", "sources": ["ScienceDaily 건강"], "links": ["https://www.sciencedaily.com/releases/2026/10/261014015521.htm"], "format": "DOSE", "catch": ["상관관계"], "score": 8, "why": ["형식 DOSE", "생활소재: cat, weight"], "doi": ["10.7326/ANNALS-25-00860"], "journal_ref": "Journal Reference : Kamika R. Reynolds, Kimberly M. OâMalley, Jason A. Roy, Chintan V. Dave. Glucagon-like Peptide-1 Receptor Agonists and Risk for Ischemic Optic Neuropathy . Annals of Internal Medicine , 2026; 179 (9): 1244 DOI: 10.7326/ANNALS-25-00860", "facts": ["The study, published in Annals of Internal Medicine , analyzed information from a large database of US adults ages 18 to 65 with Type 2 diabetes.", "Researchers focused on patients who had recently started taking medications to manage their condition, including a class of drugs known as glucagon-like peptide-1 receptor agonists, or GLP-1s.", "In addition to helping control blood sugar and manage weight, GLP-1 medications can reduce the risks of certain cardiovascular and kidney problems.", "The researchers found that GLP-1 use was associated with a modest increase in the likelihood of ischemic optic neuropathy.", "\"The increase in risk was small -- approximately three to four additional cases per 10,000 patients treated with GLP-1s over 18 months, but clinicians and patients should be aware of this potential association.\" While the absolute risk remains low, researchers say the growing popularity of GLP-1 medications makes continued safety monitoring especially important.", "These drugs are now widely prescribed to people both with and without Type 2 diabetes.", "\"Most patients in our study who had ischemic optic neuropathy were either men or men and women aged 50 to 65,\" said Dave, an associate professor at the Ernest Mario School of Pharmacy and the lead author of the study.", "\"Because ischemic optic neuropathy can present with sudden vision loss, which may be permanent, early recognition of symptoms and prompt ophthalmologic evaluation may be especially important for patients at higher baseline risk.\" More than 80% of ischemic optic neuropathy cases are estimated to involve the non-arteritic anterior form of the condition.", "According to Dave, approximately one-third of affected patients experience some recovery, usually during the first six months.", "Despite the association, the researchers caution that their findings do not establish that GLP-1 medications directly cause optic nerve damage."], "sample": ["10,000 patients"]}, {"title": "Music can enhance the flavor of your food", "link": "https://phys.org/news/2026-10-music-flavor-food.html", "key": "https://phys.org/news/2026-10-music-flavor-food.html", "summary": "The moment we take a sip of our morning coffee or our first bite of lunch, the brain begins interpreting what we taste. Is it sweet? Sour? Or something else entirely? But the brain does not create flavor based solely on signals from the tongue. That is the finding of a new study from the Department of Food Science, published in Scientific Reports.", "date": "2026-10-22", "source": "Phys.org", "first_seen": "2026-10-22", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-music-flavor-food.html"], "format": "SCALE", "catch": [], "score": 8, "why": ["형식 SCALE", "생활소재: coffee, music, brain"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-music-flavor-food.html"}, {"title": "Yale scientists discover how stress changes the brain to make memories stronger", "link": "https://www.sciencedaily.com/releases/2026/10/261014015517.htm", "key": "https://sciencedaily.com/releases/2026/10/261014015517.htm", "summary": "Yale scientists have uncovered how the stress hormone cortisol helps the brain turn emotional experiences into stronger, longer-lasting memories. The discovery reveals that stress can reshape communication between brain networks involved in emotion and memory, potentially explaining why certain moments are so difficult to forget.", "date": "2026-10-16", "source": "ScienceDaily 뇌·마음", "first_seen": "2026-10-22", "sources": ["ScienceDaily 뇌·마음"], "links": ["https://www.sciencedaily.com/releases/2026/10/261014015517.htm"], "format": "CUT", "cat const BASE = location.pathname.includes('/weeks/') ? '../' : '';
const FORMATS = ['전체','CUT','PRESS','WEIGH','DOSE','SCALE'];
let fmt = '전체', q = '', hideSeen = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(){
  const opts = D.weeks.map(w => `<option value="${w}" ${w===D.week?'selected':''}>${w}</option>`).join('');
  document.getElementById('sub').innerHTML =
    `${D.week} 주 · ${D.updated} 갱신 · 최근 8일 ${D.total}건 → 상위 ${D.items.length}건 · 지난 주 보기 <select id="wk">${opts}</select>`;
  document.getElementById('wk').onchange = e => {
    const w = e.target.value; location.href = w === D.weeks[0] ? BASE + 'index.html' : BASE + 'weeks/' + w + '.html';
  };
  const bar = document.getElementById('bar');
  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>
    (fmt==='전체' || g.format===fmt) && (!hideSeen || !g.seen) &&
    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
