tis May Leave a Hidden Memory in Your Joints"], "doi": ["10.1093/narmme/ugaf017"], "sample": [], "journal_ref": "Journal Reference : Erlend Ravlo, Aleksandr Ianevski, Marius Nårstad Skipperstøen, Hilde Lysvand, Jørn-Ove Schjølberg, Ole Solheim, Wei Wang, Miroslava Kissova, Marthe Vestvik, Olli Vapalahti, Teemu Smura, Hanna Vauhkonen, Valentyn Oksenych, Friedemann Weber, Mårten Strand, Magnus Evander, Janne Fossum Malmring, Jan Egil Afset, Magnar Bjørås, Denis E Kainov. JAK inhibitors remove innate immune bar", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261026225606.htm"], "format": "DOSE", "catch": [], "score": 7, "why": ["형식 DOSE", "훅: surpris"]}, {"title": "Are GLP-1s practical and safe for adolescents with obesity?", "link": "https://medicalxpress.com/news/2026-10-glp-1s-safe-adolescents-obesity.html", "key": "https://medicalxpress.com/news/2026-10-glp-1s-safe-adolescents-obesity.html", "summary": "GLP-1 medications have become a popular tool for weight loss. But are they appropriate for all age groups? Short for glucagon-like peptide-1, GLP-1s are medications approved by the Food and Drug Administration that treat type 2 diabetes and now obesity. They work by mimicking a natural hormone in the gut that lowers blood sugar, simulates the feeling of fullness and slows digestion.", "date": "2026-10-28", "source": "MedicalXpress", "first_seen": "2026-10-28", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-glp-1s-safe-adolescents-obesity.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-glp-1s-safe-adolescents-obesity.html"], "format": "DOSE", "catch": [], "score": 7, "why": ["형식 DOSE", "생활소재: weight loss"]}, {"title": "Common nutritional supplement may boost psoriasis treatment, small patient trial suggests", "link": "https://medicalxpress.com/news/2026-10-common-nutritional-supplement-boost-psoriasis.htm "why": ["형식 SCALE", "생활소재: chocolate, love, stress"]}, {"title": "Do more cannabis stores near schools mean more teens use cannabis? Our research suggests the answer is complicated", "link": "https://medicalxpress.com/news/2026-10-cannabis-schools-teens-complicated.html", "key": "https://medicalxpress.com/news/2026-10-cannabis-schools-teens-complicated.html", "summary": "When Canada legalized recreational cannabis in October 2018, one concern was that more legal stores would make cannabis easier for young people to access and encourage adolescent use. But does having more cannabis retailers near high schools actually mean more students use cannabis?", "date": "2026-10-28", "source": "MedicalXpress", "first_seen": "2026-10-28", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-cannabis-schools-teens-complicated.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-cannabis-schools-teens-complicated.html"], "format": "DOSE", "catch": [], "score": 7, "why": ["형식 DOSE", "훅: actually", "생활소재: teen"]}, {"title": "Earwax is both slippery and sticky – this weird combo might lead to safer insect repellents", "link": "https://theconversation.com/earwax-is-both-slippery-and-sticky-this-weird-combo-might-lead-to-safer-insect-repellents-293324", "key": "https://theconversation.com/earwax-is-both-slippery-and-sticky-this-weird-combo-might-lead-to-safer-insect-repellents-293324", "summary": "What has the consistency of both toothpaste and dough, can absorb twice its weight in water and still remain sticky, was used by medieval artists as a binder in paint and has been hypothesized by physicians to repel insects? It's earwax.", "date": "2026-10-28", "source": "The Conversation", "first_seen": "2026-10-28", "facts": ["Here’s a bit of a riddle for you: What has the consistency of both toothpaste and dough, can absorb twice its weight in water and still remain sticky, was used by medieval artists as a binder in paint and has been hypothesized by physicians to repel insects?", "People have been pondering earwax since ancient times.", "Cerumen impaction – or blocked earwax – affects about a fifth of the American population , leading to 12 million patient visits per year.", "For smooth surfaces, ants unfurl wet suction cups , which can support 60 times their body weight on smooth glass.", "We showed it can absorb twice its weight in water yet still cling to the walls of the ear.", "Over 8-10 weeks, this process – called epithelial migration – pushes the oldest earwax out of the ear."], "doi": [], "sample": [], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation", "Phys.org"], "links": ["https://theconversation.com/earwax-is-both-slippery-and-sticky-this-weird-combo-might-lead-to-safer-insect-repellents-293324", "https://phys.org/news/2026-10-earwax-slippery-sticky-weird-combo.html"], "format": "WEIGH", "catch": ["DOI 못 찾음"], "score": 7, "why": ["형식 WEIGH", "훅: weird", "2곳 보도"]}, {"title": "A simple daily fiber supplement reduced arthritis pain and improved strength", "link": "https://www.sciencedaily.com/releases/2026/10/261027230715.htm", "key": "https://sciencedaily.com/releases/2026/10/261027230715.htm", "summary": "A new clinical trial suggests that a simple daily fiber supplement could significantly reduce knee osteoarthritis pain, improve muscle strength, and make the body less sensitive to pain. Researchers discovered that the benefits may be linked to changes in gut bacteria and the hormone GLP-1, revealing a promising new approach to arthritis relief.", "date": "2026-10-28", "source": "ScienceDaily 전체", "first_seen": "2026-10-29", "facts": ["Only 3.6% of those assigned to inulin alone dropped out of the study, compared with 21% of those assigned to physical therapy alone.", "They also observed higher levels of glucagon-like peptide-1 (GLP-1), a hormone released by the gut that helps regulate blood sugar and appetite and has also been linked to pain regulation and muscle health.", "GLP-1 has attracted widespread attention because it is the hormone targeted by medications such as Ozempic and Wegovy.", "However, the inulin supplement used in this trial was not a GLP-1 medication.", "One particularly interesting finding was that higher GLP-1 levels were associated with better grip strength.", "Although this does not establish that GLP-1 caused the improvement, it suggests that changes originating in the digestive system may be connected to muscle function as well as pain.", "To investigate these effects, the researchers conducted the INSPIRE trial, a six-week randomized controlled study involving 117 adults with knee osteoarthritis.", "Only 3.6% of the inulin-only group dropped out, compared with 21% of the physical therapy-only group.", "The association between GLP-1 and grip strength raises the possibility of a broader biological relationship connecting gut health with physical performance and resilience as people age.", "Senior author Professor Ana Valdes from the School of Medicine added: \"The link we observed between GLP-1 and grip strength is particularly intriguing and points to a broader gut-muscle-pain axis that warrants further investigation."], "doi": ["10.3390/nu18050714"], "sample": ["117 adults"], "journal_ref": "Journal Reference : Afroditi Kouraki, Susan Franks, Amrita Vijay, Thomas Kurien, Moira A. Taylor, Stephanie L. Smith, Benjamin Smith, Anthony Kelly, Ana M. Valdes. Effect of Prebiotic Supplementation With and Without Physiotherapy on Pain and Pain Sensitivity in People with Knee Osteoarthritis . Nutrients , 2026; 18 (5): 714 DOI: 10.3390/nu18050714", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261027230715.htm"], "format": "DOSE", "catch": ["상관관계"], "score": 7, "why": ["형식 DOSE", "생활소재: supplement"]}, {"title": "Six popular sugar substitutes linked to faster brain aging", "link": "https://www.sciencedaily.com/releases/2026/10/261028234238.htm", "key": "https://sciencedaily.com/releases/2026/10/261028234238.htm", "summary": "A study of nearly 13,000 adults found that people consuming the most artificial sweeteners experienced a 62% faster decline in memory and thinking skills, equivalent to approximately 1.6 additional years of brain aging. Six popular sweeteners were linked to faster cognitive decline, raising concerns about the long-term brain health effects of common sugar substitutes, although causation was not established.", "date": "2026-10-29", "source": "ScienceDaily 전체", "first_seen": "2026-10-30", "facts": ["To investigate whether sugar substitutes might be connected to cognitive health, researchers analyzed data from 12,772 adults across Brazil.", "Participants were 52 years old on average when the study began and were followed for approximately eight years.", "Those in the lowest consumption group averaged 20 milligrams per day (mg/day), while those in the highest group averaged 191 mg/day.", "For comparison, 191 milligrams of aspartame is roughly the amount found in one can of diet soda.", "Of the seven sweeteners examined, sorbitol had the highest average intake, at 64 mg/day.", "High Sweetener Consumption Linked to 62% Faster Cognitive Decline The results revealed a striking difference between people who consumed the most sweeteners and those who consumed the least.", "After accounting for factors that could influence cognitive health, including age, sex, high blood pressure, and cardiovascular disease, researchers found that participants in the highest consumption group experienced a 62% faster decline in overall thinking and memory abilities compared with those in the lowest group.", "That difference was equivalent to approximately 1.6 additional years of cognitive aging over the study period.", "Participants in the middle group experienced a 35% faster decline than those consuming the least, equivalent to roughly 1.3 additional years of cognitive aging.", "Stronger Links Found in Adults Under 60 and People With Diabetes When researchers examined different age groups, they discovered that the association was not consistent across all participants."], "doi": ["10.1212/WNL.0000000000214023", "10.1212/WNL.0000000000214129"], "sample": ["12,772 adults"], "journal_ref": "Journal References : Natalia Gomes Gonçalves, Euridice Martinez-Steele, Paulo A. Lotufo, Isabela Bensenor, Alessandra C. Goulart, Sandhi Maria Barreto, Luana Giatti, Carolina Perim de Faria, Maria del Carmen Bisi Molina, Paulo Caramelli, Dirce Maria Marchioni, Claudia Kimie Suemoto. Association Between Consumption of Low- and No-Calorie Artificial Sweeteners and Cognitive Decline . Neurology , 202", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261028234238.htm"], "format": "SCALE", "catch": ["상관관계"], "score": 7, "why": ["형식 SCALE", "생활소재: aging, memory, brain"]}, {"title": "Ancient Alberta fish fossils reveal evolutionary secrets of modern species", "link": "https://phys.org/news/2026-10-ancient-alberta-fish-fossils-reveal.html", "key": "https://phys.org/news/2026-10-ancient-alberta-fish-fossils-reveal.html", "summary": "Rare, complete fossils of ancient fish discovered in Alberta are helping fill in the gaps in our knowledge about which freshwater fish were living in North America at the end of the age of the dinosaurs, and how they evolved into their modern descendants.", "date": "2026-10-29", "source": "Phys.org", "first_seen": "2026-10-30", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-ancient-alberta-fish-fossils-reveal.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-ancient-alberta-fish-fossils-reveal.html"], "format": "CUT", "catch": ["동물 실험"], "score": 7, "why": ["형식 CUT", "훅: secret", "생활소재: fish, dinosaur"]}, {"title": "Immune changes linked to diabetes could guide development of new cancer treatments", "link": "https://medicalxpress.com/news/2026-10-immune-linked-diabetes-cancer-treatments.html", "key": "https://medicalxpress.com/news/2026-10-immune-linked-diabetes-cancer-treatments.html", "summary": "New research in The Journal of Immunology uncovers how high blood sugar (hyperglycemia) and type 1 diabetes (T1D) may protect against certain cancers like melanoma, breast and colon cancer. T1D has been associated with a decreased risk of certain cancers, but the exact reasons why have remained a mystery. New data from studies in mice now show that it could be due to changes in immune cells, called T cells, caused by hyperglycemia.", "date": "2026-10-29", "source": "MedicalXpress", "first_seen": "2026-10-30", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-immune-linked-diabetes-cancer-treatments.htm", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-immune-linked-diabetes-cancer-treatments.html"], "format": "SCALE", "catch": ["동물 실험", "상관관계"], "score": 7, "why": ["형식 SCALE", "훅: mystery", "생활소재: mice"]}, {"title": "Wireless neural chip tracks brain changes in real time after Alzheimer's drug administration", "link": "https://medicalxpress.com/news/2026-10-wireless-neural-chip-tracks-brain.html", "key": "https://medicalxpress.com/news/2026-10-wireless-neural-chip-tracks-brain.html", "summary": "A joint research team led by KAIST has used a small, implantable neural chip to wirelessly monitor real-time changes in a neurotransmitter involved in memory and learning after an Alzheimer's drug has been administered. In miniature pigs (minipigs), the team observed an increase in the neurotransmitter signal following drug administration, followed by a gradual return to baseline. The technology could help researchers assess how drugs act in the brain and develop stimulation methods that adapt to the brain's response.", "date": "2026-10-27", "source": "MedicalXpress", "first_seen": "2026-10-2 const BASE = location.pathname.includes('/weeks/') ? '../' : '';
const FORMATS = ['전체','CUT','PRESS','WEIGH','DOSE','SCALE'];
let fmt = '전체', q = '', hideSeen = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(){
  const opts = D.weeks.map(w => `<option value="${w}" ${w===D.week?'selected':''}>${w}</option>`).join('');
  document.getElementById('sub').innerHTML =
    `${D.week} 주 · ${D.updated} 갱신 · 최근 8일 ${D.total}건 → 상위 ${D.items.length}건 · 지난 주 보기 <select id="wk">${opts}</select>`;
  document.getElementById('wk').onchange = e => {
    const w = e.target.value; location.href = w === D.weeks[0] ? BASE + 'index.html' : BASE + 'weeks/' + w + '.html';
  };
  const bar = document.getElementById('bar');
  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>
    (fmt==='전체' || g.format===fmt) && (!hideSeen || !g.seen) &&
    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
</body>
</html>
