t's origins and contributed the numerical simulations used in the new research."], "sample": []}, {"title": "Too much RNA can starve cells of energy, scientists discover", "link": "https://www.sciencedaily.com/releases/2026/10/261020085023.htm", "key": "https://sciencedaily.com/releases/2026/10/261020085023.htm", "summary": "Scientists have uncovered an unexpected danger lurking inside cells: too much RNA can damage the structures responsible for producing energy. A new study found that excess RNA, including the normally essential messenger RNA (mRNA), can directly disrupt mitochondria without relying on the immune system. The discovery could help explain how viral infections and certain aging-related diseases damage cells.", "date": "2026-10-21", "source": "ScienceDaily 전체", "first_seen": "2026-10-22", "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261020085023.htm"], "format": "CUT", "catch": [], "score": 6, "why": ["형식 CUT", "훅: unexpected", "생활소재: aging"], "doi": ["10.1073/pnas.2605194123"], "journal_ref": "Journal Reference : Djamal Brahim Belhaouari, Anil Pant, Santiago Navarro-Forero, Fernando Cantu, Zhilong Yang. Perturbation of RNA homeostasis impairs mitochondrial respiration during poxvirus infection through excess RNA accumulation . Proceedings of the National Academy of Sciences , 2026; 123 (22) DOI: 10.1073/pnas.2605194123", "facts": ["Another type, double-stranded RNA (dsRNA), frequently appears during viral infections.", "Scientists already understood that excessive double-stranded RNA could provoke potentially harmful immune responses.", "\"Too much double-stranded RNA or mRNA that cannot be degraded effectively may contribute to disease processes in some contexts.\" Potential Implications for mRNA Vaccines and Future Treatments The discovery could also provide useful information for scientists developing medicines that rely on RNA.", "\"Scientists already knew that too much double-stranded RNA can be harmful,\" Yang said.", "\"What surprised us was finding out that too much mRNA -- something cells normally need every day -- can also damage mitochondria and interfere with the cell's ability to produce energy.\" Research reported in this study was supported, in part, by the National Institute of Allergy and Infectious Diseases (R01AI143709 to Z.Y.) and Texas A&M University.", "Antarctica’s “Doomsday Glacier” Could Raise Sea Levels Twice As Much as Scientists Feared Snakebites Are Far Deadlier Than We Thought, New Study Reveals Archaeologists May Have Just Discovered the World’s Oldest Shipwreck Researchers Find That Arthritis May Leave a Hidden Memory in Your Joints"], "sample": []}, {"title": "Scientists find 10 different diets linked to slower aging", "link": "https://www.sciencedaily.com/releases/2026/10/261019093439.htm", "key": "https://sciencedaily.com/releases/2026/10/261019093439.htm", "summary": "A study by DZNE finds that healthy eating is associated with slower biological aging—and that there is more than one way to eat healthily. The researchers examined ten dietary patterns considered healthy, including the Mediterranean, Nordic, and a plant-based diet, as well as the DASH diet, which is designed to help lower blood pressure. The findings are published in the journal Nature Communications.", "date": "2026-10-21", "source": "ScienceDaily 전체", "first_seen": "2026-10-22", "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261019093439.htm"], "format": "SCALE", "catch": ["상관관계"], "score": 6, "why": ["형식 SCALE", "생활소재: diet, aging"], "doi": ["10.1038/s41467-026-77064-4"], "journal_ref": "Journal Reference : Juliana F. Tavares, Dan Liu, Valentina Talevi, Fabian Eichelmann, Franziska Jannasch, Matthias B. Schulze, N. Ahmad Aziz, Ute Nöthlings, Monique M. B. Breteler. Associations between diet quality, epigenetic aging and epigenome in two population-based cohorts . Nature Communications , 2026; 17 (1) DOI: 10.1038/s41467-026-77064-4", "facts": ["A large study involving approximately 7,500 people suggests that eating a healthy diet may help slow biological aging, and there is no single eating plan that stands above all others.", "Scientists at the German Center for Neurodegenerative Diseases (DZNE) investigated 10 different dietary patterns, including the Mediterranean, Nordic, plant-based, and DASH diets.", "That is an encouraging finding, because it leaves room to tailor healthy eating to personal and cultural preferences, budget and taste.\" To investigate the connection between diet and aging, the scientists analyzed dietary information and blood samples from roughly 7,500 men and women.", "The initial analysis included 6,470 participants in DZNE's Rhineland Study in Bonn, Germany.", "The researchers then tested their findings using data from another 1,034 people enrolled in the EPIC-Potsdam Study, conducted by the German Institute of Human Nutrition Potsdam-Rehbrücke (DIfE).", "\"To this end, we leveraged state-of-the-art technology, which allowed us to cover about 850,000 sites in the DNA.", "This is roughly twice as many as in most previous studies.\" The next step was to determine how closely each participant followed the 10 dietary patterns.", "Better adherence to every one of the 10 diets was associated with slower biological aging.", "More than 70% of the affected pathways were shared across all 10 diets.", "\"More than 70 percent of the affected biological pathways were shared across all diets."], "sample": ["1,034 people", "6,470 participants", "7,500 men", "7,500 people"]}, {"title": "Why some people escape Alzheimer’s despite carrying a high-risk gene", "link": "https://www.sciencedaily.com/releases/2026/10/261018205044.htm", "key": "https://sciencedaily.com/releases/2026/10/261018205044.htm", "summary": "Scientists have discovered why some people with a high genetic risk of Alzheimer’s remain mentally sharp into their 80s, uncovering a rare mutation that protects the brain from harmful protein buildup. The findings reveal a potential new way to prevent early brain damage and could pave the way for treatments that mimic this natural defense.", "date": "2026-10-19", "source": "ScienceDaily 전체", "first_seen": "2026-10-22", "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261018205044.htm"], "format": "WEIGH", "catch": [], "score": 6, "why": ["형식 WEIGH", "생활소재: alzheimer, brain"], "doi": ["10.1038/s43587-026-01204-0"], "journal_ref": "Journal Reference : Prabesh Bhattarai, Elanur Yilmaz, Elif Öykü Cakir, Huseyin Tayran, Imdadul Haq, Dylan Murphy, Jonah Nadelmann Keller, Quentin Le Grand, Jacqueline O. Eschbach, Hilal Celikkaya, Mehmet I. Cosacak, Hande Yüceer Korkmaz, Annie J. Lee, Verena Haage, Yiyi Ma, Xue Wang, Nastasia Nelson, Weilin Lin, Yixin Zhang, Bengisu Turgutalp, Sherida M. de Leeuw, Ronak Patel, Dörthe Jülich, Özkan", "facts": ["Some people carry one of the strongest genetic risk factors for Alzheimer's disease yet never develop it, remaining mentally sharp well into their 80s.", "The discovery builds on research the team published two years ago involving APOE ε4, a gene variant strongly associated with Alzheimer's risk.", "The scientists found that some people carrying APOE ε4 also possess a rare protective mutation in the fibronectin (FN1) gene.", "However, in people with APOE ε4, excessive amounts can accumulate around blood vessels in the brain, potentially compromising a critical protective system known as the blood-brain barrier.", "The rare FN1 mutation appears to limit this buildup and the damage associated with it.", "Despite the variety of methods, the findings consistently pointed to the same mechanism: APOE ε4 promotes the production and accumulation of fibronectin around the brain's blood vessels.", "In mice engineered to carry human APOE ε4, researchers measured nearly twice as much fibronectin in the brain as in mice carrying APOE ε3, another common version of the gene.", "These abnormal signals disrupt a network of growth factors called VEGF, HBEGF, and IGF1.", "Genetic and gene-regulation analyses also connected FN1 to blood vessel disease and changes involving VEGFA, a growth factor that plays an important role in maintaining healthy brain blood vessels.", "Together, these findings provide multiple lines of evidence linking excess fibronectin to the vascular damage associated with APOE ε4."], "sample": []}, {"title": "Something strange is happening beneath a volcano near 2 million people", "link": "https://www.sciencedaily.com/releases/2026/10/261018205039.htm", "key": "https://sciencedaily.com/releases/2026/10/261018205039.htm", "summary": "Scientists have discovered evidence of two hidden magma sources beneath Nicaragua’s Masaya volcano, where satellite observations revealed mysterious ground movements suggesting magma is shifting deep underground. The findings could improve eruption forecasting for the active volcano, which sits near 2 million people and attracts tourists to its spectacular lava lake.", "date": "2026-10-19", "source": "ScienceDaily 전체", "first_seen": "2026-10-22", "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261018205039.htm"], "format": "PRESS", "catch": [], "score": 6, "why": ["형식 PRESS", "훅: strange"], "doi": ["10.1029/2026GL123214"], "journal_ref": "Journal Reference : E. Johnson, Y. C. Kim, C. Wauthier. Double Trouble: Two Active Magma Reservoirs Identified at Masaya Volcano, Nicaragua, Using Satellite Geodesy . Geophysical Research Letters , 2026; 53 (14) DOI: 10.1029/2026GL123214", "facts": ["The discovery is particularly important because approximately 2 million people live within 13 miles of the volcano, which is also a popular tourist destination.", "\"Having a thorough understanding of Masaya's volcanic activity and its related hazards is critical as around 2 million people live near Masaya and the caldera is a national park and popular tourist destination,\" Johnson said.", "\"Although Masaya last produced a major lava flow in 1772, its persistent degassing often produces dangerously high concentrations of sulfur dioxide volcanic gas.\" Sulfur dioxide is a potentially harmful volcanic gas released as magma approaches or remains near the surface.", "\"And then if there is a need to warn people, we can do that in a timely manner.\" To investigate Masaya's underground activity, the researchers analyzed measurements collected by the Sentinel-1 satellite, which observes the volcano approximately once every 12 days.", "By comparing satellite measurements taken at different times, scientists can identify areas where the ground is rising or sinking.", "The satellite measurements revealed an intriguing pattern between 2018 and 2024.", "National Science Foundation through awards 1945417 and 2523375, along with computational resources provided by Penn State's Institute for Computational and Data Sciences.", "Antarctica’s “Doomsday Glacier” Could Raise Sea Levels Twice As Much as Scientists Feared Snakebites Are Far Deadlier Than We Thought, New Study Reveals Archaeologists May Have Just Discovered the World’s Oldest Shipwreck Researchers Find That Arthritis May Leave a Hidden Memory in Your Joints"], "sample": []}, {"title": "Physicists create a bizarre new quantum state called a fractional fermi sea", "link": "https://www.sciencedaily.com/releases/2026/10/261018084644.htm", "key": "https://sciencedaily.com/releases/2026/10/261018084644.htm", "summary": "Physicists have discovered a strange new state of quantum matter in which ultracold atoms defy familiar organizational rules, forming a highly excited yet surprisingly orderly configuration called a \"fractional Fermi sea.\" The discovery challenges established quantum theories and hints at exotic quasiparticles that scientists have dubbed potential \"super-Fermions.\"", "date": "2026-10-18", "source": "ScienceDaily 전체", "first_seen": "2026-10-22", "sources": ["ScienceDaily 전체 fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-brain-integers-fractions.html"}, {"title": "Mental health support for parents after pediatric intensive care may modestly reduce PTSD and depressive symptoms", "link": "https://medicalxpress.com/news/2026-10-mental-health-parents-pediatric-intensive.html", "key": "https://medicalxpress.com/news/2026-10-mental-health-parents-pediatric-intensive.html", "summary": "Admission to a pediatric intensive care unit (PICU) can have lasting psychological effects on both children receiving treatment and their parents. To investigate the effects of psychosocial interventions on parents' emotional health, researchers searched five major academic databases for studies published through January 2026 and analyzed eight randomized controlled trials evaluating psychosocial interventions in parents of children admitted to the PICU. The interventions included visits to follow-up clinics, psychological screening with referral, telephone-based psychoeducation, palliative care consultations and acceptance and commitment therapy delivered via videoconference. The findings a", "date": "2026-10-23", "source": "MedicalXpress", "first_seen": "2026-10-23", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-mental-health-parents-pediatric-intensive.html"], "format": "SCALE", "catch": [], "score": 5, "why": ["형식 SCALE", "생활소재: children"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-mental-health-parents-pediatric-intensive.ht"}, {"title": "Gut microbiome may help explain why sleep improvement varies after hydrogen supplementation", "link": "https://medicalxpress.com/news/2026-10-gut-microbiome-varies-hydrogen-supplementation.html", "key": "https://medicalxpress.com/news/2026-10-gut-microbiome-varies-hydrogen-supplementation.html", "summary": "A Hiroshima University–led clinical trial found that hydrogen supplementation did not significantly improve sleep quality compared with a placebo; however, exploratory analyses suggest that differences in the abundance of hydrogen-producing gut bacteria may be associated with individual differences in sleep-related responses.", "date": "2026-10-23", "source": "MedicalXpress", "first_seen": "2026-10-24", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-gut-microbiome-varies-hydrogen-supplementati", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-gut-microbiome-varies-hydrogen-supplementation.html"], "format": "SCALE", "seen": "2026-10-19", "catch": ["상관관계"], "score": 5, "why": ["형식 SCALE", "훅: did not", "생활소재: sleep, supplement", "이미 본 소재(2026-10-19)"]}, {"title": "Plant-first food pyramid brings international dietary guidelines together in adaptable global guide", "link": "https://medicalxpress.com/news/2026-10-food-pyramid-international-dietary-guidelines.html", "key": "https://medicalxpress.com/news/2026-10-food-pyramid-international-dietary-guidelines.html", "summary": "Dietary guidance varies by country, and no international food pyramid has brought its recommendations together until now. BYU nutritional science professor Karen Della Corte led a global team of nutrition scientists to develop an International Food Guide Pyramid that reflects broad scientific agreement and can be adapted across cultures and borders.", "date": "2026-10-23", "source": "MedicalXpress", "first_seen": "2026-10-24", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-food-pyramid-international-dietary-guidelines.html"], "format": "SCALE", "catch": [], "score": 5, "why": ["형식 SCALE", "생활소재: diet"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-food-pyramid-international-dietary-guideline"}, {"title": "Power cuts and sleep: Students link load shedding to anxiety, disrupted rest and lower grades", "link": "https://phys.org/news/2026-10-power-students-link-anxiety-disrupted.html", "key": "https://phys.org/news/2026-10-power-students-link-anxiety-disrupted.html", "summary": "South Africa endured its worst year of load shedding (scheduled power cuts by the country's utility, Eskom) in 2023. The power went off on 335 of the year's 365 days, often several times a day. Since then, the country has gone more than a year and a half without these planned power cuts.", "date": "2026-10-24", "source": "Phys.org", "first_seen": "2026-10-24", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-power-students-link-anxiety-disrupted.html"], "format": "WEIGH", "catch": [], "score": 5, "why": ["형식 WEIGH", "생활소재: sleep"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-power-students-link-anxiety-disrupted.html"}, {"title": "Elections are more predictable than they look", "link": "https://phys.org/news/2026-10-elections.html", "key": "https://phys.org/news/2026-10-elections.html", "summary": "As politics in America become more polarized and each voting cycle seems more fraught than the last, a common narrative in the media is that each election is unique and increasingly unpredictable. But new research shows that congressional elections follow strong statistical patterns, even when individual races produce surprises.", "date": "2026-10-24", "source": "Phys.org", "first_seen": "2026-10-24", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-elections.html"], "format": "PRESS", "catch": [], "score": 5, "why": ["형식 PRESS", "훅: surpris"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-elections.html"}, {"title": "Potatoes could be the secret to better plant-based meat, say food scientists", "link": "https://phys.org/news/2026-10-potatoes-secret-based-meat-food.html", "key": "https://phys.org/news/2026-10-potatoes-secret-based-meat-food.html", "summary": "Potatoes could hold the key to making better gluten-free plant-based meat, according to a new study.", "date": "2026-10-24", "source": "Phys.org", "first_seen": "2026-10-24", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-potatoes-secret-based-meat-food.html"], "format": "SCALE", "catch": [], "score": 5, "why": ["형식 SCALE", "훅: secret"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-potatoes-secret-based-meat-food.html"}, {"title": "Tegoprubart preserves kidney function better than tacrolimus in first-time transplant patients, trial suggests", "link": "https://medicalxpress.com/news/2026-10-tegoprubart-kidney-function-tacrolimus-transplant.html", "key": "https://medicalxpress.com/news/2026-10-tegoprubart-kidney-function-tacrolimus-transplant.html", "summary": "The phase 2 BESTOW clinical trial showed that tegoprubart (a novel anti-CD40L antibody therapy) was better at preserving kidney function than tacrolimus (the current standard of care) in immunosuppressive regimens in adults receiving their first kidney transplant. Kidney graft function stabilized after the first month of treatment and remained higher in tegoprubart-treated patients than in tacrolimus-treated patients at each reported time point, with a statistically significant kidney function benefit at 18 months. A recent analysis of BESTOW data found that tegoprubart also caused greater improvements in patient-reported health-related quality of life compared with tacrolimus in study parti", "date": "2026-10-24", "source": "MedicalXpress", "first_seen": "2026-10-24", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-tegoprubart-kidney-function-tacrolimus-transplant.html"], "format": "SCALE", "catch": [], "score": 5, "why": ["형식 SCALE"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-tegoprubart-kidney-function-tacrolimus-trans"}, {"title": "ESMO: New analysis reinforces survival benefits of targeted therapy for advanced pancreatic cancer", "link": "https://medicalxpress.com/news/2026-10-esmo-analysis-survival-benefits-therapy.html", "key": "https://medicalxpress.com/news/2026-10-esmo-analysis-survival-benefits-therapy.html", "summary": "A new analysis of a phase 3 clinical trial found that the targeted drug daraxonrasib improved survival compared with standard chemotherapy across multiple groups of patients with advanced pancreatic cancer, including those with different RAS mutations and those without an identified RAS mutation.", "date": "2026-10-24", "source": "MedicalXpress", "first_seen": "2026-10-24", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-esmo-analysis-survival-benefits-therapy.html"], "format": "SCALE", "catch": [], "score": 5, "why": ["형식 SCALE"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-esmo-analysis-survival-benefits-therapy.html"}, {"title": "Postpartum recovery window may play a critical role in maternal aging and long-term health", "link": "https://medicalxpress.com/news/2026-10-postpartum-recovery-window-play-critical.html", "key": "https://medicalxpress.com/news/2026-10-postpartum-recovery-window-play-critical.html", "summary": "In many studies, it appears that women who have more children have a higher risk of heart disease and a shorter life span, but this effect is inconsistent across populations and no good explanation for it exists. Against this backdrop, new tools to assess biological age—the age reflected by one's biological state, rather than simply the number of years they have been alive—have revealed that pregnancy temporarily elevates biological age, while postpartum recovery can return it closer to baseline.", "date": "2026-10-26", "source": "MedicalXpress", "first_seen": "2026-10-26", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-postpartum-recovery-window-play-critical.html"], "format": "CUT", "catch": [], "score": 5, "why": ["형식 C cycling and sustaining food webs, received only 6.6% of the financial backing."], "sample": []}, {"title": "NASA’s Mars orbiter fleet is getting old – here’s how that could affect future exploration", "link": "https://theconversation.com/nasas-mars-orbiter-fleet-is-getting-old-heres-how-that-could-affect-future-exploration-292555", "key": "https://theconversation.com/nasas-mars-orbiter-fleet-is-getting-old-heres-how-that-could-affect-future-exploration-292555", "summary": "NASA lost contact with its Maven spacecraft – the youngest of its Mars orbiters – at the end of 2025. The others in its fleet are over two decades old.", "date": "2026-10-19", "source": "The Conversation", "first_seen": "2026-10-22", "sources": ["The Conversation"], "links": ["https://theconversation.com/nasas-mars-orbiter-fleet-is-getting-old-heres-how-that-could-affect-future-exploration-292555"], "format": "PRESS", "catch": ["DOI 못 찾음"], "score": 4, "why": ["형식 PRESS"], "doi": [], "facts": ["Currently, about 16,000 satellites are orbiting Earth , providing everything from GPS service and weather reports to phone service in remote locations to people across the globe.", "Starting in 2021, there were three from NASA, two from the European Space Agency and one each from the Indian Space Research Organization, the UAE Space Agency and the China National Space Administration.", "The oldest of these is still 2001 Mars Odyssey, which has now spent 25 years in space, with Mars Express, at 23 years, and the Mars Reconnaissance Orbiter, at 20 years, hot on its heels.", "But in December 2025, NASA lost contact with its Maven spacecraft , bringing the total number of active satellites down to seven, and NASA’s to two.", "The cause of the loss of Maven has still not been publicly released, and NASA officially declared the mission over in June 2026.", "In September 2026, NASA selected Jeff Bezos’ Blue Origin to provide a Mars telecommunication satellite no later than Dec. 31, 2028.", "The Mars Atmosphere and Volatile EvolutioN, or Maven, spacecraft arrived at Mars in 2014, making it NASA’s youngest orbiter.", "Whatever happened to Maven last December was only the second time in the 21st century that NASA had lost contact with an orbiter during otherwise ordinary operations.", "The other time was in 2006, with Mars Global Surveyor , which NASA ultimately lost, likely due to issues with uploaded software commands.", "The Mars exploration community, myself among them, is waiting with bated breath to understand why one-third of NASA’s Mars fleet lost contact seemingly overnight."], "sample": []}, {"title": "There should be black holes in our neighborhood. Can we find them?", "link": "https://phys.org/news/2026-10-black-holes-neighborhood.html", "key": "https://phys.org/news/2026-10-black-holes-neighborhood.html", "summary": "Scientific estimates show that there should be between about 100 million and 1 billion stellar-mass black holes in the Milky Way. But they aren't easy to locate. They're not like supermassive black holes (SMBH) at the centers of galaxies. Those are usually easy to spot for different reasons.", "date": "2026-10-22", "source": "Phys.org", "first_seen": "2026-10-22", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-black-holes-neighborhood.html"], "format": "WEIGH", "catch": [], "score": 4, "why": ["형식 WEIGH"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-black-holes-neighborhood.html"}, {"title": "Canine cancer patients contribute to next-generation minimally invasive cancer therapies for dogs and humans", "link": "https://phys.org/news/2026-10-canine-cancer-patients-contribute-generation.html", "key": "https://phys.org/news/2026-10-canine-cancer-patients-contribute-generation.html", "summary": "Natural disasters. Hikes. Long, dark nights alone. For many people, dogs offer a sense of safety and comfort in challenging or uncertain times. Cancer researchers at a new lab at Purdue University are partner const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(){
  const opts = D.weeks.map(w => `<option value="${w}" ${w===D.week?'selected':''}>${w}</option>`).join('');
  document.getElementById('sub').innerHTML =
    `${D.week} 주 · ${D.updated} 갱신 · 최근 8일 ${D.total}건 → 상위 ${D.items.length}건 · 지난 주 보기 <select id="wk">${opts}</select>`;
  document.getElementById('wk').onchange = e => {
    const w = e.target.value; location.href = w === D.weeks[0] ? BASE + 'index.html' : BASE + 'weeks/' + w + '.html';
  };
  const bar = document.getElementById('bar');
  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>

    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
</body>
</html>
