encedaily.com/releases/2026/11/261113232000.htm", "key": "https://sciencedaily.com/releases/2026/11/261113232000.htm", "summary": "A surprising discovery from Rockefeller University suggests that a common amino acid could play a powerful role in protecting against cancer and viral infections. Scientists found that low arginine levels interfere with the immune system's ability to recognize dangerous cells, while increasing arginine intake reduced colon cancer tumors and improved viral infection outcomes in mice. Even more remarkably, giving mice arginine after they contracted influenza helped them recover.", "date": "2026-11-15", "source": "ScienceDaily 전체", "first_seen": "2026-11-16", "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/11/261113232000.htm"], "format": "CUT", "catch": ["동물 실험"], "score": 7, "why": ["형식 CUT", "훅: surpris", "생활소재: supplement, mice"], "doi": ["10.1016/j.cell.2026.07.020"], "journal_ref": "Journal Reference : Qiushuang Wu, Lara M. Seydlitz, Vladislav Iakimov, Dennis J. Hsu, Parham Habibzadeh, H. Heinrich Hoffmann, Philip B. Paty, Charles M. Rice, Sohail F. Tavazoie. Dietary arginine drives codon-dependent MHC class I translation and improves immunity in colon tumorigenesis and respiratory viral infection . Cell , 2026; 189 (19): 6012 DOI: 10.1016/j.cell.2026.07.020", "facts": ["In experiments involving mice, increasing dietary arginine reduced the formation of colon cancer tumors and lessened the severity of influenza and SARS-CoV-2 infections.", "In 2023, the researchers discovered that depriving colon cancer cells of arginine caused them to accumulate more genetic mutations.", "When arginine becomes scarce, cells struggle to produce enough of a crucial immune system protein known as MHC-1.", "Without enough MHC-1, abnormal or infected cells may become harder for the immune system to recognize.", "To investigate, Wu examined the effects of arginine availability across several disease models, including c ion cases in 2024, with 610,000 people dying from the parasitic infection. Ninety-five percent of deaths occur in sub-Saharan Africa, where children under the age of 5 are particularly affected. Prompt treatment is crucial. Nevertheless, some patients die from malaria even when treated with medication.", "date": "2026-11-10", "source": "MedicalXpress", "first_seen": "2026-11-10", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-11-protein-contributes-blood-vessel-brain.html"], "format": "CUT", "catch": [], "score": 6, "why": ["형식 CUT", "생활소재: children, brain"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-11-protein-contributes-blood-vessel-brain.html"}, {"title": "GLP-1 drugs show lower obesity-related cancer risk than insulin, but not all diabetes treatments", "link": "https://medicalxpress.com/news/2026-11-glp-drugs-obesity-cancer-insulin.html", "key": "https://medicalxpress.com/news/2026-11-glp-drugs-obesity-cancer-insulin.html", "summary": "Years of research point to obesity and type 2 diabetes raising the risk of developing several types of cancer. Glucagon-like peptide-1 receptor agonists (GLP-1 RAs), a recent medical breakthrough, were originally developed for blood sugar control or diabetes management and also work overtime promoting weight loss. Scientists are curious to explore whether there are any links between these drugs and the onset of cancers in people with diabetes.", "date": "2026-11-10", "source": "MedicalXpress", "first_seen": "2026-11-10", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-11-glp-drugs-obesity-cancer-insulin.html"], "format": "WEIGH", "catch": ["과장 의심 단어"], "score": 6, "why": ["형식 WEIGH", "생활소재: weight loss"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-11-glp-drugs-obesity-cancer-insulin.html"}, {"title": "Rare eye condition prompts new FDA warning on popular GLP-1 drugs", "link": "htt function header(){

  };

  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
</body>
</html>
