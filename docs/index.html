ore than 300,000 new cases of brain cancer are reported each year, with glioblastoma, an aggressive form of brain cancer, accounting for over 250,000 deaths. The current standard of care involves the use of temozolomide (TMZ), a chemotherapy medication. However, the tumor can be difficult to control because cancer cells evolve to evade the effects of such treatments. Thus, finding new ways to target these cells is an important area in cancer research.", "date": "2026-11-07", "source": "MedicalXpress", "first_seen": "2026-11-07", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-11-compounds-drug-resistant-brain-cancer.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-11-compounds-drug-resistant-brain-cancer.html"], "format": "DOSE", "catch": [], "score": 6, "why": ["형식 DOSE", "생활소재: brain"]}, {"title": "New species of ground-dwelling bird, the largest of its kind, identified in same cave as Homo floresiensis", "link": "https://phys.org/news/2026-11-species-ground-bird-largest-kind.html", "key": "https://phys.org/news/2026-11-species-ground-bird-largest-kind.html", "summary": "In 2009, researchers working in the Liang Bua cave on Flores Island came across a leg bone. The 190,000–120,000-year-old fossil was identified as a bird bone and set aside. Like many bird bones before it, it was overlooked and left to collect dust.", "date": "2026-11-09", "source": "Phys.org", "first_seen": "2026-11-09", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-species-ground-bird-largest-kind.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-species-ground-bird-largest-kind.html"], "format": "CUT", "catch": [], "score": 6, "why": ["형식 CUT", "생활소재: bird"]}, {"title": "Reversing radiation-activated immune suppression in cancer", "link": "https://medicalxpress.com/news/2026-10-reversing-immune-suppression-cancer.html", "key": "https://medicalxpress.com/news/2026-10-reversing-immune-suppression-cancer.html", "summary": "Researchers at the University of Chicago have identified a mechanism to make immune cells reprogrammed by radiation therapy attack tumors rather than protect them. The study, published in Cancer Cell, shows that radiation activates a protein called TET2 on immune cells in bone marrow, where it removes chemical tags from RNA and locks these cells into an immune-suppressing state.", "date": "2026-11-01", "source": "MedicalXpress", "first_seen": "2026-11-01", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-reversing-immune-suppression-cancer.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-reversing-immune-suppression-cancer.html"], "format": "CUT", "catch": [], "score": 5, "why": ["형식 CUT"]}, {"title": "Predicting jumping genes' roles in changing genome size", "link": "https://phys.org/news/2026-11-genes-roles-genome-size.html", "key": "https://phys.org/news/2026-11-genes-roles-genome-size.html", "summary": "A genome contains all of the DNA of every living organism, but its contents don't stop there—most of these structures also contain snippets of DNA that can copy and paste themselves to \"infect\" a genome, expanding its size. Precisely why that happens remains a mystery.", "date": "2026-11-03", "source": "Phys.org", "first_seen": "2026-11-03", "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-11-genes-roles-genome-size.html", "catch_extra": [], "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-11-genes-roles-genome-size.html"], "format": "CUT", "catch": [], "score": 5, "why": ["형식 CUT", "훅: mystery"]}, {"title": "Zombies are real—just ask the parasites taking over the bodies and brains of insects and rodents", "link": "https://phys.org/news/2026-11-zombies-real-parasites-bodies-brains.html", "key": "https://phys.org/news/2026- , "sample": ["8,200 adults"], "journal_ref": "Journal Reference : Qianhui Xu, Meng Hsuan Sung, Zhuo Chen, Janani Rajbhandari-Thapa, Grace Bagwell Adams, M. Mahmud Khan, Ye Shen, Xiao Song, Xia Song, Suhang Song. Association between cumulative average BMI and cognitive decline: a 24-year cohort study . Journal of Neurology , 2026; 273 (2) DOI: 10.1007/s00415-026-13696-2", "catch_extra": [], "sources": ["ScienceDaily 뇌·마음"], "links": ["https://www.sciencedaily.com/releases/2026/11/261101010559.htm"], "format": "WEIGH", "seen": "2026-11-02", "catch": [], "score": 4, "why": ["형식 WEIGH", "생활소재: aging, memory, brain", "이미 본 소재(2026-11-02)"]}, {"title": "A Feejee Mermaid on display in Colorado may shock and intrigue – but it’s no longer considered a ‘missing link’ on the evolutionary tree", "link": "https://theconversation.com/a-feejee-mermaid-on-display-in-colorado-may-shock-and-intrigue-but-its-no-longer-considered-a-missing-link-on-the-evolutionary-tree-294775", "key": "https://theconversation.com/a-feejee-mermaid-on-display-in-colorado-may-shock-and-intrigue-but-its-no-longer-considered-a-missing-link-on-the-evolutionary-tree-294775", "summary": "Mermaids have inhabited world folklore and mythology for centuries. Ancient Babylonians worshiped Oannes, a human-fish hybrid; sirens populated Greek mythology; and fairy tales such as \"The Little Mermaid\" have made this figure a pop culture icon.", "date": "2026-11-04", "source": "The Conversation", "first_seen": "2026-11-05", "facts": ["During the 1800s, American showman P.T.", "Presented at the American Museum, run by Barnum in Manhattan from 1841 to 1865 , as “ The Greatest Curiosity in the World ” and said to have originated in the “Feejee Islands,” the creature inspired debates about science and evolution.", "A Feejee Mermaid is a type of traditional art form that originated in Japan and the East Indies more than 400 years ago.", "It came to Americans in 1842, when Barnum claimed to display a “specimen” at the American Museum in New York City.", "In the Japanese version, the lower half was a fish attached to an upper half of a monkey or made of papier-mâché.", "Barnum’s was a mixture of a monkey and a fish, but the replica on display at the Denver Museum of Nature and Science has a papier-mâché upper half.", "The Feejee Mermaid that became part of Barnum’s exhibition was created by a Japanese fisherman in the early 19th century.", "Samuel Barrett Eades, an American sailor, purchased the Feejee Mermaid and willed it to his son, who then sold it to Moses Kimball , a curator at the Boston Museum, in 1842.", "In fact, 18th-century Swedish naturalist Carl Linnaeus had left space for mermaids in the evolutionary tree .", "The Feejee Mermaid, as it blended human and animal characteristics, folklore and science, spectacle and empiricism, displays how a monstrous hoax inspired fierce intellectual debates in 19th-century America."], "doi": [], "sample": [], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation", "Phys.org"], "links": ["https://theconversation.com/a-feejee-mermaid-on-display-in-colorado-may-shock-and-intrigue-but-its-no-longer-considered-a-missing-link-on-the-evolutionary-tree-294775", "https://phys.org/news/2026-11-feejee-mermaid-display-colorado-intrigue.html"], "format": "", "seen": "2026-11-02", "catch": ["동물 실험", "DOI 못 찾음"], "score": 4, "why": ["훅: myth, shock", "생활소재: baby, fish", "2곳 보도", "이미 본 소재(2026-11-02)"]}, {"title": "‘Epic’ blue wave helps Democrats take Congress in overwhelming rebuke to President Trump", "link": "https://theconversation.com/epic-blue-wave-helps-democrats-take-congress-in-overwhelming-rebuke-to-president-trump-295830", "key": "https://theconversation.com/epic-blue-wave-helps-democrats-take-congress-in-overwhelming-rebuke-to-president-trump-295830", "summary": "Election Day turned into a massive rebuke of President Donald Trump: a blue wave not seen in 20 years that was built on transforming the economy and rising prices into a central line of attack.", "date": "2026-11-04", "source": "The Conversation", "first_seen": "2026-11-05", "facts": ["What I think is particularly notable here, and something we were on the lookout for in this election, and we’re seeing it, is the substantial shift in the Hispanic vote from 2024 in places like Texas and Florida, where you’re getting these 30-to-35 point shifts from how Donald Trump performed in 2024.", "Some rural areas of the country were also more competitive than expected, like North Carolina’s 11th Congressional District, where Democrat Jaime Ager flipped a conservative district .", "I think we’re probably also likely to see, and we saw some of this in the exit polling, a major shift in independent voters, unaffiliated voters, toward the Democrats, whereas in 2024 they had been closer to Trump.", "In Georgia, for example, Election Day’s turnout was on pace to beat turnout in the 2024 presidential elections.", "In a midterm election you typically see 10% or 15% less turnout than you would in a presidential election.", "But Democrats voted in presidential-level numbers in a lot of these really key areas, and that’s explaining how they’re able to overperform at levels we haven’t seen in at least 20 years.", "Elon Musk spent nearly half a billion dollars supporting Republican candidates, including some US$200 million in Texas to elect Ken Paxton for the Senate, who lost.", "Going from zero dollars spent to $10 million spent, that’s a very different kind of campaign.", "But once you go from $500 million to $510 million, that’s not going to get you a whole lot more votes.", "What we’ve seen in these midterm elections is a massive rebuke of the last two years of the Trump administration, and a sort of blue wave of epic proportions toward the Democrats, the likes of which we haven’t seen in 20 or more years."], "doi": [], "sample": [], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/epic-blue-wave-helps-democrats-take-congress-in-overwhelming-rebuke-to-president-trump-295830"], "format": "WEIGH", "catch": ["DOI 못 찾음"], "score": 4, "why": ["형식 WEIGH"]}, {"title": "Flesh-eating screwworm is spreading in the US, threatening livestock and wildlife – hunters can be the first line of defense", "link": "https://theconversation.com/flesh-eating-screwworm-is-spreading-in-the-us-threatening-livestock-and-wildlife-hunters-can-be-the-first-line-of-defense-292891", "key": "https://theconversation.com/flesh-eating-screwworm-is-spreading-in-the-us-threatening-livestock-and-wildlife-hunters-can-be-the-first-line-of-defense-292891", "summary": "Over 100 screwworm cases have appeared in US animals in 2026, including in elk. How America’s 11.5 million hunters can help find these parasites and contain the spread.", "date": "2026-11-06", "source": "The Conversation", "first_seen": "2026-11-07", "facts": ["For the first time in over 50 years, an infestation of the flesh-eating fly known as the New World screwworm ( Cochliomyia hominivorax ) is spreading on the U.S. mainland, and it is putting livestock and other animals at risk.", "In the 1950s, livestock producers in the U.S.", "Southwest lost up to US$100 million annually to New World screwworm infections, equivalent to over $1 billion today.", "The nation was eventually able to eradicate the New World screwworm from the mainland in 1966 using a combination of treating infected animals and raising hundreds of millions of sterilized male flies and releasing them in infested areas.", "The New World screwworm has a life cycle of only about 21 days, and each female mates only once.", "Since 2022, the parasites have been reproducing and moving farther northward .", "Wildlife have received far less attention than livestock during screwworm infestations, with one exception: In July 2016, the New World screwworm was detected in the Florida Keys in an endangered deer population : the Florida Key deer ( Odocoileus virginianus clavium ).", "At the time, the Florida Key deer population was estimated at only about 800 to 1,000 individuals .", "They inspected more than 16,900 animals – dogs, cats, a pig and a raccoon were also found with larvae – and they released 150 million sterile flies across the area.", "The islands lost 9% to 20% of the total Key Deer population , but the New World screwworm was declared eradicated there on March 23, 2017, less than a year after it was discovered."], "doi": [], "sample": ["1,000 individuals"], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/flesh-eating-screwworm-is-spreading-in-the-us-threatening-livestock-and-wildlife-hunters-can-be-the-first-line-of-defense-292891"], "format": "SCALE", "catch": ["DOI 못 찾음"], "score": 4, "why": ["형식 SCALE"]}], "status": [{"feed": "ScienceDaily 전체", "url": "https://www.sciencedaily.com/rss/all.xml", "ok": true, "items": 60, "span_days": 7}, {"feed": "ScienceDaily 별난연구", "url": "https://www.sciencedaily.com/rss/strange_offbeat.xml", "ok": true, "items": 60, "span_days": 29}, {"feed": "ScienceDaily 뇌·마음", "url": "https://www.sciencedaily.com/rss/mind_brain.xml", "ok": true, "items": 60, "span_days": 27}, {"feed": "ScienceDaily 동식물", "url": "https://www.sciencedaily.com/rss/plants_animals.xml", "ok": true, "items": 60, "span_days": 38}, {"feed": "ScienceDaily 건강", "url": "https://www.sciencedaily.com/rss/top/health.xml", "ok": true, "items": 60, "span_days": 12}, {"feed": "Phys.org", "url": "https://phys.org/rss-feed/", "ok": true, "items": 30, "span_days": 2}, {"feed": "MedicalXpress", "url": "https://medicalxpress.com/rss-feed/", "ok": true, "items": 30, "span_days": 3}, {"feed": "The Conversation", "url": "https://theconversation.com/us/articles.atom", "ok": true, "items": 50, "span_days": 8}], "weeks": ["2026-11-09", "2026-11-02", "2026-10-26", "2026-10-19"], "total": 738, "updated": "2026-11-09 11:42"};
const BASE = location.pathname.includes('/weeks/') ? '../' : '';
const FORMATS = ['전체','CUT','PRESS','WEIGH','DOSE','SCALE'];
let fmt = '전체', q = '', hideSeen = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(){
  const opts = D.weeks.map(w => `<option value="${w}" ${w===D.week?'selected':''}>${w}</option>`).join('');
  document.getElementById('sub').innerHTML =
    `${D.week} 주 · ${D.updated} 갱신 · 최근 8일 ${D.total}건 → 상위 ${D.items.length}건 · 지난 주 보기 <select id="wk">${opts}</select>`;
  document.getElementById('wk').onchange = e => {
    const w = e.target.value; location.href = w === D.weeks[0] ? BASE + 'index.html' : BASE + 'weeks/' + w + '.html';
  };
  const bar = document.getElementById('bar');
  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>
    (fmt==='전체' || g.format===fmt) && (!hideSeen || !g.seen) &&
    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
</body>
</html>
