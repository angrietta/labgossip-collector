 Time and The New York Times .", "When Science published letters to the editor from mathematicians and demographers attacking von Foerster and his colleagues’ work — calling it “ridiculous” and “manifestly absurd” — the authors responded with spirited defenses that doubled down on the underlying math and its conclusions."], "doi": [], "sample": [], "catch_extra": ["DOI 못 찾음"], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261016070639.htm"], "format": "PRESS", "catch": ["DOI 못 찾음"], "score": 8, "why": ["형식 PRESS", "훅: surpris"]}, {"title": "James Webb reveals a strange bulge in an alien planet's atmosphere", "link": "https://www.sciencedaily.com/releases/2026/10/261015073205.htm", "key": "https://sciencedaily.com/releases/2026/10/261015073205.htm", "summary": "Astronomers using the James Webb Space Telescope have discovered that a distant alien planet's atmosphere is surprisingly lopsided. Located 1,300 light-years away, the scorching gas giant WASP-17b experiences powerful winds that redistribute heat, causing one side of its atmosphere to bulge outward. A groundbreaking new mapping technique revealed these hidden distortions, confirming predictions about how extreme temperatures and winds shape alien worlds.", "date": "2026-10-17", "source": "ScienceDaily 별난연구", "first_seen": "2026-10-22", "facts": ["Using NASA's James Webb Space Telescope (JWST), researchers have discovered that the atmosphere of WASP-17b, a giant planet roughly 1,300 light-years from Earth, extends farther outward on one side than the other.", "WASP-17b belongs to a class of planets known as 'hot Jupiters', enormous gas giants that orbit close to their host stars and experience intense heating.", "\"This is proof of concept that planets are in fact 3D objects, and that consistently, as they go around their star, what we predict should be happening is happening.", "To move beyond computational exercises and see it for real is a different matter.\" The observations provide valuable information about WASP-17b's atmospheric chemistry and temperature variations, including differences between its equator and poles and between its permanently illuminated and dark hemispheres.", "Together, they offer one of the most detailed three-dimensional pictures of an exoplanet's atmosphere yet produced, establishing a useful reference point for studying the more than 6,000 exoplanets confirmed so far.", "The fact that all of these numbers came together and showed us this very structured, dynamical picture of this giant world over 1,000 light-years away was just really exciting.\" James Webb's extraordinary sensitivity has already enabled scientists to investigate alien atmospheres using a method called eclipse mapping.", "So, we've gone from a ring to understanding where on the ring the gemstones are, so to speak.\" The new measurements revealed a particularly interesting feature near WASP-17b's equator, precisely where previous models predicted it would appear.", "The transit mapping measurements also supported other previously identified characteristics of WASP-17b.", "Alderson added: \"Theory predicts that the morning and the evening sides should have a strong temperature difference, and WASP-17b fits really nicely in that trend -- pretty much bang-on what we thought it would be.\" Successfully applying transmission strings to WASP-17b demonstrates that the technique could be used to study the atmospheres of many other exoplanets.", "Scientists Discover a Potential Early Warning Sign of Alzheimerâs in Adults As Young as 45 40 Years of Superconductor Science Just Got Turned Upside Down by a Stunning Discovery"], "doi": ["10.1038/s41550-026-02986-4"], "sample": [], "journal_ref": "Journal Reference : Lili Alderson, Hannah R. Wakeford, David Grant, Nikole K. Lewis, Avinash Verma, Jayesh Goyal, Mark Hammond, Daniel Valentine, Natalie H. Allen, Ana Glidden, AmÃ©lie Gressier, Jingcheng Huang, Maura Lally, Dana R. Louie, Jacob Lustig const BASE = location.pathname.includes('/weeks/') ? '../' : '';
const FORMATS = ['전체','CUT','PRESS','WEIGH','DOSE','SCALE'];
let fmt = '전체', q = '', hideSeen = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(){
  const opts = D.weeks.map(w => `<option value="${w}" ${w===D.week?'selected':''}>${w}</option>`).join('');
  document.getElementById('sub').innerHTML =
    `${D.week} 주 · ${D.updated} 갱신 · 최근 8일 ${D.total}건 → 상위 ${D.items.length}건 · 지난 주 보기 <select id="wk">${opts}</select>`;
  document.getElementById('wk').onchange = e => {
    const w = e.target.value; location.href = w === D.weeks[0] ? BASE + 'index.html' : BASE + 'weeks/' + w + '.html';
  };
  const bar = document.getElementById('bar');
  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>
    (fmt==='전체' || g.format===fmt) && (!hideSeen || !g.seen) &&
    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
