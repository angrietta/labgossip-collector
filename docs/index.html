called claudin-4 as the essential docking point for a bacterial toxin known as BFT.", "\"Understanding how bacterial toxins work can open doors to new approaches for detection and therapy for associated diseases, including diarrhea, colorectal cancer and bloodstream infections.\" The investigation centers on Bacteroides fragilis , a bacterium that can be found in the intestines of up to 20% of healthy people.", "In a landmark 2009 study published in Nature Medicine , Sears and her colleagues demonstrated that the toxin could promote the development of colon tumors.", "It produces claudin-4, a protein that helps neighboring cells form tight junctions, the seals that limit the movement of substances between cells and help maintain the intestinal barrier.", "When the researchers disabled the gene responsible for claudin-4, BFT could no longer bind to the colon cells.", "The finding revealed that claudin-4 acts as a receptor for the bacterial toxin.", "\"It took a while to get the assay working and validate the approach, but once we were able to do the screen, claudin-4 was a clear, resounding top hit,\" says White.", "Claudin-4, however, serves a very different purpose.", "To establish that BFT and claudin-4 truly bind to each other, the Johns Hopkins researchers collaborated with structural biologists F.", "Using techniques that measure how molecules interact, White and the Barcelona team showed that BFT and claudin-4 form a tightly bound complex in laboratory experiments."], "sample": []}, {"title": "A mysterious 4,000-year-old wall is rewriting North Africa’s history", "link": "https://www.sciencedaily.com/releases/2026/10/261030003022.htm", "key": "https://sciencedaily.com/releases/2026/10/261030003022.htm", "summary": "A remarkable 4,000-year-old defensive structure discovered in Morocco is rewriting what scientists thought they knew about ancient North African civilizations. The massive fortifications reveal unexpectedly sophisticated prehistoric societies and suggest that the region played a much greater role in Mediterranean history than previously recognized.", "date": "2026-10-31", "source": "ScienceDaily 전체", "first_seen": "2026-11-01", "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261030003022.htm"], "format": "WEIGH", "catch": [], "score": 6, "why": ["형식 WEIGH", "훅: unexpected"], "doi": ["10.1017/lis.2026.10037"], "journal_ref": "Journal Reference : Giulio Lucarini, Youssef Bokbot, Toby Wilkinson, Hamza Benattia, Aïcha Bigoulimen, Alessia Brucato, Marlena Cygan, Lucy Farr, Hassan Hachami, Evangelia Kiriatzi, Rafael Laoutari, Lorena Lombardi, Adelaide Marsilio, Rafael Martínez Sánchez, Ilaria Mazzini, Jacob Morales, Giulia Muti, Jacques Pelegrin, Moad Radi, Francesco Michele Rega, Cyprian Broodbank. Expanding Oued Beht: Fin", "facts": ["It dates to around 5,400 to 4,900 years ago.", "New excavations carried out in 2023 – in which we took part – have now deepened our understanding of the site.", "It’s about 4,000 to 3,500 years old.", "Our study also reveals how the ridge of Oued Beht would become a focal point again in the medieval period, during the 11th to 13th centuries AD.", "Together these findings provide rare archaeological insights into rural communities during both prehistoric and medieval times.", "The earliest major phase dates to the mid-fourth and early third millennia BC, or the Final Neolithic period.", "The presence of potentially ancient earthworks and walls had been noted since the 1930s.", "In southern Iberia, Argaric societies (about 2200-1550 BC) in today’s Europe were developing complex, often hilltop settlements.", "Scientists Uncover a Shocking Possibility 237-Million-Year-Old Fossils Reveal an Amphibian That Shouldn’t Have Existed The Brain Is More Capable of Healing Itself Than Scientists Thought Scientists Discover Never-Before-Seen Molecules With Cancer-Fighting Potential"], "sample": []}, {"title": "A simple blood test could reveal Alzheimer’s risk 10 years before symptoms", "link": "https://www.sciencedaily.com/releases/2026/10/261029072142.htm", "key": "https://sciencedaily.com/releases/2026/10/261029072142.htm", "summary": "A major international study found that a simple blood test could help predict Alzheimer’s-related cognitive decline years before symptoms appear, with the highest-risk individuals facing a 38% chance of impairment within five years and an estimated 78% chance within 10 years. Scientists believe the discovery could pave the way for earlier intervention and future treatments designed to prevent Alzheimer’s before memory problems begin.", "date": "2026-10-31", "source": "ScienceDaily 전체", "first_seen": "2026-11-01", "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261029072142.htm"], "format": "PRESS", "catch": [], "score": 6, "why": ["형식 PRESS", "생활소재: memory, alzheimer"], "doi": ["10.1001/jama.2026.12556"], "journal_ref": "Journal Reference : Rachel F. Buckley, Diana L. Townsend, Colin J. Birkenbihl, Madison Cuppels, Gillian T. Coughlan, Mabel T. Seto, Jane A. Brown, Michael J. Properzi, Merle C. Hönig, Annie Li, Aaron P. Schultz, Jasmeer Chhatwal, Hyun-Sik Yang, Steven Arnold, Pia Kivisäkk, Bryan D. James, Sid O’Bryant, Robert A. Rissman, Melissa Petersen, Jessica Z. K. Caldwell, Tobey Betthauser, Julie Elisabeth O", "facts": ["In a large international study, researchers found that older adults with very high levels of a particular blood biomarker faced a 38% chance of developing cognitive impairment within five years.", "Over 10 years, the estimated risk rose to 78%, although the longer-term findings were based on substantially less data.", "The study focused on phosphorylated tau 217 (p-tau217), a blood biomarker associated with Alzheimer's disease.", "Together, these studies included 2,684 older adults who showed no signs of cognitive impairment when they entered the research.", "At enrollment, participants provided blood samples that were analyzed for p-tau217.", "Some participants entered one of the studies as early as 2004, while the most recent follow-up assessments took place in 2025.", "Across the studies, approximately 478 participants eventually developed cognitive impairment.", "When researchers compared these outcomes with the original blood test results, they found a strong relationship between higher p-tau217 levels and the likelihood of future cognitive problems.", "Among people with very high biomarker levels, the estimated probability of developing cognitive impairment reached 38% within five years.", "By 10 years, that figure increased to 78%."], "sample": ["2,684 adults", "478 participants"]}, {"title": "75,000-year-old Neanderthal may have been killed by a spear aimed at the heart", "link": "https://www.sciencedaily.com/releases/2026/10/261029072126.htm", "key": "https://sciencedaily.com/releases/2026/10/261029072126.htm", "summary": "A Neanderthal who died 75,000 years ago may have been killed by a wooden spear deliberately aimed at the heart, revealing rare evidence of prehistoric violence. A circular hole in the shoulder blade suggests the weapon pierced the chest and caused a rapidly fatal injury. Surprisingly, the same individual had survived an earlier devastating facial injury, suggesting other Neanderthals provided care and support.", "date": "2026-10-31", "source": "ScienceDaily 전체", "first_seen": "2026-11-01", "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261029072126.htm"], "format": "CUT", "catch": [], "score": 6, "why": ["형식 CUT", "훅: surpris"], "doi": ["10.1038/s41598-026-69193-z"], "journal_ref": "Journal Reference : Emma Pomeroy, Christopher O. Hunt, Lucía López-Polín, Nohemi Sala, Ana Pantoja Pérez, James Holman, Jessica Twyman, Paul Bennett, Tim Reynolds, Ross Lane, Duncan Pirrie, Graeme Barker. Evidence for funerary behaviour and lethal trauma in a new Neanderthal individual from Shanidar Cave . Scientific Reports , 2026; 16 (1) DOI: 10.1038/s41598-026-69193-z", "facts": ["A small, circular hole in a 75,000-year-old Neanderthal shoulder blade may reveal one of the earliest known cases of deadly violence involving a wooden spear.", "Despite its fragile structure, the Neanderthal's bone survived for approximately 75,000 years beneath seven and a half meters of rock and sediment.", "Almost the entire bone remained intact, except for a remarkably precise circular opening measuring 15 millimeters across.", "\"It's extraordinary to have a perfectly preserved scapula from 75,000 years ago.", "One important discovery occurred in the 1990s at Schöningen, Germany, where researchers uncovered wooden spears preserved in waterlogged conditions.", "Dating back roughly 200,000 years, these weapons were made during a period when early Neanderthals inhabited Europe.", "In 1911, a pointed wooden fragment was recovered from the shoreline and later identified as part of a spear more than 400,000 years old.", "Together, these are the surviving remains of an adult Neanderthal believed to have been approximately 45 years old at death.", "An incisor from the front of the lower jaw had been split vertically, leaving just half of the tooth intact.", "The surviving half of the incisor had accumulated substantial tartar (dental calculus) along its exposed root canal, indicating that the damaged tooth remained in the mouth for an extended period after the injury."], "sample": []}, {"title": "Spending in-person time with friends is the biggest predictor of whether college students flourish", "link": "https://theconversation.com/spending-in-person-time-with-friends-is-the-biggest-predictor-of-whether-college-students-flourish-293908", "key": "https://theconversation.com/spending-in-person-time-with-friends-is-the-biggest-predictor-of-whether-college-students-flourish-293908", "summary": "Exercise, avoiding alcohol or even getting enough sleep aren't the factors most connected to college students' well-being. Spending face-to-face time with friends and other people is the strongest predictor of their mental health, according to a 2026 study of nearly 80,000 students that I conducted with the help of my students.", "date": "2026-10-26", "source": "The Conversation", "first_seen": "2026-10-27", "facts": ["Spending face-to-face time with friends and other people is the strongest predictor of their mental health, according to a 2026 study of nearly 80,000 students that I conducted with the help of my students.", "Between 2010 and 2022, the percentage of U.S. high school seniors who reported seeing friends face-to-face almost every day declined from 44% to 32% .", "Suicide remains the second-leading cause of death among Americans ages 15 to 34.", "Our research team analyzed responses from 79,246 college students across the United States and Canada.", "We examined 51 aspects of students’ lives, including their substance use, the discrimination they encountered, their financial stress, any sleep problems and different relationship challenges."], "doi": [], "sample": ["80,000 students"], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation", "Phys.org"], "links": ["https://theconversation.com/spending-in-person-time-with-friends-is-the-biggest-predictor-of-whether-college-students-flourish-293908", "https://phys.org/news/2026-10-inperson-friends-biggest-predictor-college.html"], "format": "PRESS", "seen": "2026-10-26", "catch": ["상관관계", "DOI 못 찾음"], "score": 5, "why": ["형식 PRESS", "생활소재: sleep, alcohol, exercise", "2곳 보도", "이미 본 소재(2026-10-26)"]}, {"title": "Personalized cancer vaccine plus immunotherapy reduces melanoma recurrence after surgery", "link": "https://medicalxpress.com/news/2026-10-personalized-cancer-vaccine-immunotherapy-melanoma.html", "key": "https://medicalxpress.com/news/2026-10-personalized-cancer-vaccine-immunotherapy-melanoma.html", "summary": "Adding a personalized mRNA-based cancer vaccine to immunotherapy after surgery for high-risk melanoma reduced the risk of recurrence or death by 42%, according to results from the phase 3 INTerpath-001 trial presented at the ESMO Congress 2026. The vaccine, intismeran autogene, was given alongside pembrolizumab and compared with pembrolizumab alone.", "date": "2026-10-27", "source": "MedicalXpress", "first_seen": "2026-10-27", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-personalized-cancer-vaccine-immunotherapy-melanoma.html"], "format": "SCALE", "catch": [], "score": 5, "why": ["형식 SCALE"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-personalized-cancer-vaccine-immunotherapy-me"}, {"title": "Patients given apalutamide and hormone therapy around surgery may cut their risk of metastasis or death", "link": "https://medicalxpress.com/news/2026-10-patients-apalutamide-hormone-therapy-surgery.html", "key": "https://medicalxpress.com/news/2026-10-patients-apalutamide-hormone-therapy-surgery.html", "summary": "An international phase 3 clinical trial that treated patients with high-risk localized and locally advanced prostate cancer with apalutamide—a next-generation neoadjuvant androgen-receptor pathway inhibitor (ARPI)—plus hormone therapy before and after prostate cancer surgery was further validated by a substudy demonstrating a reduced risk of metastasis or death compared with standard of care.", "date": "2026-10-27", "source": "MedicalXpress", "first_seen": "2026-10-27", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-patients-apalutamide-hormone-therapy-surgery.html"], "format": "SCALE", "catch": [], "score": 5, "why": ["형식 SCALE"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-patients-apalutamide-hormone-therapy-surgery"}, {"title": "Targeted drug significantly delays advanced breast cancer progression but increases toxicity, phase III trial reports", "link": "https://medicalxpress.com/news/2026-10-drug-significantly-delays-advanced-breast.html", "key": "https://medicalxpress.com/news/2026-10-drug-significantly-delays-advanced-breast.html", "summary": "In a global phase 1 trial, trastuzumab rezetecan showed promising signs of fighting ERBB2-low metastatic breast cancer in patients who had already undergone extensive treatment. Also known as HER2-low breast cancer, this subtype is characterized by low levels of HER2, a growth factor protein that can still be targeted for treatment. Trastuzumab rezetecan is an antibody-drug conjugate (ADC) that works like a guided missile, seeking out tumor cells expressing low levels of ERBB2 and delivering a toxic chemotherapy payload directly inside them.", "date": "2026-10-28", "source": "MedicalXpress", "first_seen": "2026-10-28", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-drug-significantly-delays-advanced-breast.html"], "format": "CUT", "catch": [], "score": 5, "why": ["형식 CUT"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-drug-significantly-delays-advanced-breast.ht"}, {"title": "Amygdala activity predicts which new images may become lasting memories", "link": "https://medicalxpress.com/news/2026-10-amygdala-images-memories.html", "key": "https://medicalxpress.com/news/2026-10-amygdala-images-memories.html", "summary": "A walnut-sized area of the brain known as the amygdala plays a giant role in determining which experiences end up in long-term memory and which are forgotten. The Cedars-Sinai Health Sciences University discovery points to the amygdala as a potential target for treating memory disorders.", "date": "2026-10-27", "source": "MedicalXpress", "first_seen": "2026-10-28", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-amygdala-images-memories.html"], "format": "PRESS", "catch": [], "score": 5, "why": ["형식 PRESS", "생활소재: memory, brain"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-amygdala-images-memories.html"}, {"title": "Q&A: Could a new melanoma vaccine change cancer treatment?", "link": "https://medicalxpress.com/news/2026-10-qa-melanoma-vaccine-cancer-treatment.html", "key": "https://medicalxpress.com/news/2026-10-qa-melanoma-vaccine-cancer-treatment.html", "summary": "A personalized melanoma vaccine, called intismeran, could mark a major advance in cancer treatment. Last week, pharmaceutical companies Merck and Moderna announced clinical trial results showing the vaccine, combined with immunotherapy, reduced the risk of cancer returning or death by 42% compared with immunotherapy alone.", "date": "2026-10-28", "source": "MedicalXpress", "first_seen": "2026-10-28", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-qa-melanoma-vaccine-cancer-treatment.html"], "format": "SCALE", "catch": [], "score": 5, "why": ["형식 SCALE"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-qa-melanoma-vaccine-cancer-treatment.html"}, {"title": "ADHD medication amplifies brain response to grammatically ambiguous sentences, study finds", "link": "https://medicalxpress.com/news/2026-10-adhd-medication-amplifies-brain-response.html", "key": "https://medicalxpress.com/news/2026-10-adhd-medication-amplifies-brain-response.html", "summary": "In a neuroimaging study published in PNAS, a team of researchers led by the Max Planck Institute for Psycholinguistics in Nijmegen recorded the brain activity of healthy adults during sentence comprehension after raising catecholamine levels with stimulant medication (methylphenidate). Higher catecholamine levels led to stronger recruitment of cognitive resources during processing of grammatically ambiguous sentences, showing how neurochemical systems may shape language processing.", "date": "2026-10-28", "source": "MedicalXpress", "first_seen": "2026-10-28", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-adhd- uture may change where they decide to migrate, according to a new study led by researchers at Penn State. At the same time, income losses due to climate shocks, or extreme weather events like floods or droughts, may constrain migration options for vulnerable populations.", "date": "2026-10-28", "source": "Phys.org", "first_seen": "2026-10-29", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-livelihood-goals-affect-migration-climate.html"], "format": "PRESS", "catch": [], "score": 5, "why": ["형식 PRESS", "훅: shock"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-livelihood-goals-affect-migration-climate.html"}, {"title": "Analysis of 244 million Americans refines the understanding of long COVID", "link": "https://medicalxpress.com/news/2026-10-analysis-million-americans-refines-covid.html", "key": "https://medicalxpress.com/news/2026-10-analysis-million-americans-refines-covid.html", "summary": "Long COVID is a phenomenon in which serious health effects linger well after a patient tests negative for coronavirus infection. Patients describe persistent \"brain fog,\" fatigue, dizziness, rapid heart rate, shortness of breath and chest pain, among symptoms that affect nearly every organ system in the body and last a year or more after the infection has passed.", "date": "2026-10-29", "source": "MedicalXpress", "first_seen": "2026-10-29", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-analysis-million-americans-refines-covid.html"], "format": "CUT", "catch": [], "score": 5, "why": ["형식 CUT", "생활소재: brain"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-analysis-million-americans-refines-covid.htm"}, {"title": "Sun's outer magnetic field mapped in 3D for the first time", "link": "https://phys.org/news/2026-10-sun-outer-magnetic-field-3d.html", "key": "https://phys.org/news/2026-10-sun-outer-magnetic-field-3d.html", "summary": "A team of researchers has produced the first global, three-dimensional estimates of the sun's magnetic field, including the area beyond the sun's visible edge. This marks a step toward more accurate models of solar activity—and ultimately, better predictions of solar magnetic eruptions, which are the root cause of extreme space weather that can impact critical infrastructure technologies on Earth.", "date": "2026-10-29", "source": "Phys.org", "first_seen": "2026-10-29", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-sun-outer-magnetic-field-3d.html"], "format": "PRESS", "catch": [], "score": 5, "why": ["형식 PRESS", "훅: first time"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-sun-outer-magnetic-field-3d.html"}, {"title": "UV scans uncover natural varnish that may have preserved ancient Chauvet Cave drawings", "link": "https://phys.org/news/2026-10-uv-scans-uncover-natural-varnish.html", "key": "https://phys.org/news/2026-10-uv-scans-uncover-natural-varnish.html", "summary": "Tucked away inside a limestone cave in southeastern France lies some of the oldest artwork in existence. Known as Chauvet Cave, the site is so historically important—and fragile—that its location is kept secret and the cave is locked behind a huge steel door. And now, researchers have devised a technique to safely investigate these artworks and understand the natural varnish that has protected them for centuries. Their findings are published in the journal ACS Omega.", "date": "2026-10-29", "source": "Phys.org", "first_seen": "2026-10-29", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-uv-scans-uncover-natural-varnish.html"], "format": "CUT", "catch": [], "score": 5, "why": ["형식 CUT", "훅: secret"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-uv-scans-uncover-natural-varnish.html"}, {"title": "Capturing our closest archaeal relatives offers clues to the origin of eukaryotes", "link": "https://phys. rror": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-images-reveal-ribosome-human-cells.html"}, {"title": "Customizable nanoparticles show potential for delivering personalized cancer vaccines", "link": "https://phys.org/news/2026-10-customizable-nanoparticles-potential-personalized-cancer.html", "key": "https://phys.org/news/2026-10-customizable-nanoparticles-potential-personalized-cancer.html", "summary": "A nanoscale particle with a unique structure, developed at MIT, holds potential as a customizable delivery vehicle for personalized cancer vaccines. The backbone of the vaccine is a modified, harmless bacteriophage called M13, which forms a nanofiber that can be coated with cancer antigens. By precisely controlling the density of those cancer proteins, the researchers found that they could create a vaccine that prevents the development of colon tumors in mice.", "date": "2026-10-31", "source": "Phys.org", "first_seen": "2026-10-31", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-customizable-nanoparticles-potential-personalized-cancer.html"], "format": "CUT", "catch": ["동물 실험"], "score": 5, "why": ["형식 CUT", "생활소재: mice"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-customizable-nanoparticles-potential-personalized-can"}, {"title": "Figuring out where cosmic neutrinos come from is tricky - radio telescopes could help find where these ‘ghost particles’ originate", "link": "https://theconversation.com/figuring-out-where-cosmic-neutrinos-come-from-is-tricky-radio-telescopes-could-help-find-where-these-ghost-particles-originate-294408", "key": "https://theconversation.com/figuring-out-where-cosmic-neutrinos-come-from-is-tricky-radio-telescopes-could-help-find-where-these-ghost-particles-originate-294408", "summary": "Neutrinos are funny little particles that weigh almost nothing, making them one of the universe's most elusive building blocks. They can come from objects as mundane as bananas and as exotic as supernovas—the exploding death throes of massive stars. Most neutrinos stream through space and pass through the Earth without interacting with anything.", "date": "2026-10-30", "source": "The Conversation", "first_seen": "2026-10-31", "sources": ["The Conversation", "Phys.org"], "links": ["https://theconversation.com/figuring-out-where-cosmic-neutrinos-come-from-is-tricky-radio-telescopes-could-help-find-where-these-ghost-particles-originate-294408", "https://phys.org/news/2026-10-figuring-cosmic-neutrinos-tricky-radio.html"], "format": "WEIGH", "catch": ["DOI 못 찾음"], "score": 5, "why": ["형식 WEIGH", "2곳 보도"], "doi": [], "facts": ["A study that my colleagues and I published in October 2026 suggests that we could potentially use radio telescopes to answer this question.", "Scientists have been able to detect neutrinos from space – called astrophysical neutrinos – since the 1960s.", "IceCube has used this approach to detect astrophysical neutrinos that are hundreds of thousands of times more energetic than those previously seen.", "Quasars – objects where matter is being ripped apart by black holes millions of times more massive than our Sun – seem to be likely candidates.", "In 2017, IceCube detected a neutrino that appeared to come from the direction of a quasar , known as TXS 0506+056, at the same time that a telescope detected an outburst of gamma radiation from that same object.", "However, TXS 0506+056 is just one object.", "Beginning in 2017, the Very Large Array in New Mexico began tracking how radio emissions from space change in brightness over time, a project known as the Very Large Array Sky Survey , or VLASS for short.", "Interestingly, when we compared the times that IceCube detected neutrinos with the times when objects spotted by VLASS experienced flares of radio emission, there appeared to be a correlation.", "These radio flares seem to only be associated with about 13% of the astrophysical neutrinos detected by IceCube, which means we still can’t account for the origin of the majority of astrophysical neutrinos.", "However, more than 90% of the radio outbursts potentially associated with neutrinos aren’t seen at all by our gamma-ray telescopes."], "sample": []}, {"title": "Hidden erosion: Study reveals soft mountain rock erodes three times faster than hard rock—with climate implications", "link": "https://phys.org/news/2026-10-hidden-erosion-reveals-soft-mountain.html", "key": "https://phys.org/news/2026-10-hidden-erosion-reveals-soft-mountain.html", "summary": "A University of Massachusetts Amherst-led research team has discovered that weaker rock in mountain landscapes erodes three times faster than harder rock—even on gentler slopes—and is one of the main attributes governing mountain erosion. The finding also challenges our current understanding of the relationship between erosion and the release of carbon dioxide, and suggests that geologists and atmospheric scientists may be underestimating the CO₂ contributions coming from the Earth's rocky places.", "date": "2026-10-31", "source": "Phys.org", "first_seen": "2026-10-31", "sources": ["Phys.org"], "links": ["https://phys.org/news/2026-10-hidden-erosion-reveals-soft-mountain.html"], "format": "WEIGH", "catch": [], "score": 5, "why": ["형식 WEIGH", "훅: underestimat"], "fetch_error": "403 Client Error: Forbidden for url: https://phys.org/news/2026-10-hidden-erosion-reveals-soft-mountain.html"}, {"title": "Rare fossil discovery reveals new dinosaur species that specialized in eating fruit", "link": "https://phys.org/news/2026-10-rare-fossil-discovery-reveals-dinosaur.html", "key": "https://phys.org/news/2026-10-rare-fossil-discovery-reveals-dinosaur.html", "summary": "Among the ravenous carnivores and lumbering herbivores that roamed the Cretaceous landscape, another kind of dinosaur was evolving that started to eat something else: the plants that began to flower and produce fruit. The discovery by paleontologists from Stony Brook University const BASE = location.pathname.includes('/weeks/') ? '../' : '';
const FORMATS = ['전체','CUT','PRESS','WEIGH','DOSE','SCALE'];
let fmt = '전체', q = '', hideSeen = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(){
  const opts = D.weeks.map(w => `<option value="${w}" ${w===D.week?'selected':''}>${w}</option>`).join('');
  document.getElementById('sub').innerHTML =
    `${D.week} 주 · ${D.updated} 갱신 · 최근 8일 ${D.total}건 → 상위 ${D.items.length}건 · 지난 주 보기 <select id="wk">${opts}</select>`;
  document.getElementById('wk').onchange = e => {
    const w = e.target.value; location.href = w === D.weeks[0] ? BASE + 'index.html' : BASE + 'weeks/' + w + '.html';
  };
  const bar = document.getElementById('bar');
  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>
    (fmt==='전체' || g.format===fmt) && (!hideSeen || !g.seen) &&
    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
</body>
</html>
