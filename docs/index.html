: "Americans are eating way less turkey than we used to", "link": "https://theconversation.com/americans-are-eating-way-less-turkey-than-we-used-to-295921", "key": "https://theconversation.com/americans-are-eating-way-less-turkey-than-we-used-to-295921", "summary": "Despite evidence that Americans still love poultry, they’re eating 25% less turkey.", "date": "2026-11-16", "source": "The Conversation", "first_seen": "2026-11-17", "facts": ["Annual consumption has fallen by more than 25% over the past three decades, while demand for chicken has soared.", "More than US$5 billion worth of the birds were sold in 2025.", "Back in 1995, the average American consumed 17.7 pounds (8 kilograms) of turkey each year.", "By 2025, consumption had fallen to just 13.2 pounds (6 kg).", "While turkey consumption started to recede in the late 1990s, it began accelerating around 2008, when the Great Recession was underway .", "Occasionally, turkey production ticks upward a little, as happened in 2026 as demand for niche products like turkey jerky rose, but the long-term picture is one of steady decline.", "Chicken consumption has steadily grown during this turkey slump, rising about 50% from 69 pounds (31 kg) in 1995 to 104 pounds (47 kg) in 2025.", "In other words, we’re eating almost eight times more chicken than turkey.", "Well, at least the 95% of Americans who aren’t vegetarian or vegan are.", "Over the past 25 years, wholesale turkey prices per pound averaged about 10% higher than chicken , according to U.S."], "doi": [], "sample": ["5 people"], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/americans-are-eating-way-less-turkey-than-we-used-to-295921"], "format": "SCALE", "catch": ["DOI 못 찾음"], "score": 5, "why": ["형식 SCALE", "생활소재: love"]}, {"title": "Why do farts smell so bad? A microbiologist explains the odors brewing in your gut", "link": "https://theconversation.com/why-do-farts-smell-so-bad-a-microbiologist-explains-the-odors-brewing-in-your-gut-294335", "key": "https://theconversation.com/why-do-farts-smell-so-bad-a-microbiologist-explains-the-odors-brewing-in-your-gut-294335", "summary": "Your farts’ aromas are tuned to your diet – and your overall health.", "date": "2026-11-09", "source": "The Conversation", "first_seen": "2026-11-10", "facts": ["Why do farts smell so bad? – Daisy, age 7, New York, New York A healthy person farts about 14 to 20 times each day .", "Anywhere from 20% to 90% of a fart’s volume consists of nitrogen, which makes up more than three quarters of air.", "Up to 10% of a fart is oxygen, which humans need in order to breathe.", "Up to 30% is carbon dioxide, up to 50% is hydrogen, and up to 10% is methane.", "Only tiny amounts are required: One molecule of hydrogen sulfide among 1 million other gas molecules has enough power to do the job.", "That’s equivalent to one kernel of corn in a truckload of about 1,250 ears, or 10 bricks out of all the bricks that make up the Empire State Building in New York City.", "It will come out somehow – sometimes at speeds up to 10 feet per second, according to back-of-the-envelope estimates , including my own.", "According to the Guinness book of world records, the oldest joke ever written down was a popular proverb dating back about 3,900 years that warned new husbands about their wives’ farts .", "In the 2010 movie “ Despicable Me ,” for example, mad tech wizard Dr."], "doi": [], "sample": [], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/why-do-farts-smell-so-bad-a-microbiologist-explains-the-odors-brewing-in-your-gut-294335"], "format": "CUT", "catch": ["DOI 못 찾음"], "score": 4, "why": ["형식 CUT", "생활소재: diet"]}, {"title": "GLP-1 drugs carry risk of rare but serious eye condition – a physician studying these medicines explains the potential side effect", "link": "https://theconversation.com/glp-1-drugs-carry-risk-of-rare-but-serious-eye-condition-a-physician-studying-these-medicines-explains-the-potential-side-effect-296237", "key": "https://theconversation.com/glp-1-drugs-carry-risk-of-rare-but-serious-eye-condition-a-physician-studying-these-medicines-explains-the-potential-side-effect-296237", "summary": "Doctors often call the condition a stroke of the eye – and though the risk is small, patients should know the symptoms and seek immediate treatment if they occur.", "date": "2026-11-11", "source": "The Conversation", "first_seen": "2026-11-11", "facts": ["GLP-1 drugs must now carry a warning label about a potential link to a rare eye condition that can result in vision loss, the U.S.", "Food and Drug Administration announced on Nov. 9. 2026.", "I am a clinician and epidemiologist who has studied GLP-1 drugs, and my colleagues and I published one of the studies that identified a link between GLP-1 drugs and NAION .", "Millions of people around the world take these medications – including 30 million in the U.S. – to treat diabetes and obesity and reduce the risk of cardiovascular disease.", "The data on which the FDA’s warning is based suggests a real but low risk of NAION for people taking GLP-1 medications.", "Here’s what patients who use GLP-1 drugs need to know about this rare but serious side effect.", "As use of GLP-1 drugs increased – particularly since 2021, when they were approved for obesity – cases of NAION began to emerge.", "A 2024 study of close to 17,000 patients referred to ophthalmology clinics was the first to show a potential link.", "It reported an increased risk of the eye condition among the subset of those patients who were prescribed a GLP-1 drug.", "To determine that the connection was strong enough to merit a warning, the FDA first compiled data from 126 randomized, controlled clinical trials of GLP-1 drugs."], "doi": [], "sample": ["100,000 patients", "100,000 people", "134,253 patients", "17,000 patients"], "catch_extra": ["DOI 못 찾음"], "sources": ["The Conversation"], "links": ["https://theconversation.com/glp-1-drugs-carry-risk-of-rare-but-serious-eye-condition-a-physician-studying-these-medicines-explains-the-potential-side-effect-296237"], "format": "DOSE", "catch": ["DOI 못 찾음"], "score": 4, "why": ["형식 DOSE"]}, {"title": "You likely have genes that affect how well your medications work – testing for them could improve treatment", "link": "https://theconversation.com/you-likely-have-genes-that-affect-how-well-your-medications-work-testing-for-them-could-improve-treatment-296352", "key": "https://theconversation.com/you-likely-have-genes-that-affect-how-well-your-medications-work-testing-for-them-could-improve-treatment-296352", "summary": "Researchers found that everyone in a 100,000 sample of people has at least one genetic variant that interacts with common prescriptions.", "date": "2026-11-12", "source": "The Conversation", "first_seen": "2026-11-12", "facts": ["Moreover, 1 in 4 already take a medication their body processes differently because of their genetics.", "To improve the diversity of pharmacogenomic data, my team of researchers and I analyzed the whole genome sequences and health records of nearly 100,000 participants in the All of Us Research Program .", "All of Us is an effort from the National Institutes of Health to study the health of 1 million or more people across the U.S. and its territories, with a focus on groups historically left out of biomedical research.", "We examined 16 genes with well-established links to how someone responds to different medications, pairing this data with electronic health records to identify which drugs participants had already taken.", "Around 99.5% of participants had a genetic variant for which the Food and Drug Administration or medical guidelines recommend a different drug or change in dose for certain medications.", "Even more telling, about 24% had taken a drug that is affected by a genetic variant they carried.", "We identified 17,704 previously unreported variants in the regions of these genes that   bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>
    (fmt==='전체' || g.format===fmt) && (!hideSeen || !g.seen) &&
    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
</body>
</html>
