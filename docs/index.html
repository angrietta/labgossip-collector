ss.com/news/2026-10-glp-1s-safe-adolescents-obesity.html"}, {"title": "Common nutritional supplement may boost psoriasis treatment, small patient trial suggests", "link": "https://medicalxpress.com/news/2026-10-common-nutritional-supplement-boost-psoriasis.html", "key": "https://medicalxpress.com/news/2026-10-common-nutritional-supplement-boost-psoriasis.html", "summary": "Researchers in China have discovered that the vitamin B5 derivative pantethine limits the activity of immune cells that are key contributors to autoimmune diseases such as psoriasis. The study, published in the Journal of Experimental Medicine, shows that pantethine prevents the development of psoriasis in mice and also helps alleviate the symptoms of psoriasis patients in a small-scale human trial.", "date": "2026-10-27", "source": "MedicalXpress", "first_seen": "2026-10-28", "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-common-nutritional-supplement-boost-psoriasis.html"], "format": "SCALE", "catch": [], "score": 7, "why": ["형식 SCALE", "생활소재: supplement, mice"], "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-common-nutritional-supplement-boost-psoriasi"}, {"title": "Coffee calories have jumped nearly 40%. Sugar isn't the biggest culprit", "link": "https://www.sciencedaily.com/releases/2026/10/261021231224.htm", "key": "https://sciencedaily.com/releases/2026/10/261021231224.htm", "summary": "Your morning coffee may be packing more calories than you realize, and sugar isn't the biggest reason. A study of 30,000 Americans found that non-dairy creamer has overtaken sugar and milk as the leading source of added coffee calories, helping drive a nearly 40% increase between 2003 and 2018.", "date": "2026-10-22", "source": "ScienceDaily 전체", "first_seen": "2026-10-22", "facts": ["The study, published online in the Journal of the Academy of Nutrition and Dietetics, examined dietary information from 30,000 American adults aged 20 and older.", "Between 2003 and 2018, average coffee consumption stayed relatively constant at approximately 13 ounces per day.", "However, the average number of calories consumed from coffee increased from 43 to 60 per day, a rise of nearly 40%.", "By 2018, the leading sources of added coffee calories were non-dairy creamer, sugar or syrup, and dairy milk.", "\"The more we know about what people are consuming, the better we can understand the link between nutrition and overall health.\" To investigate how Americans' coffee habits evolved, the research team examined eight consecutive cycles of the National Health and Nutrition Examination Survey (NHANES), covering 2003 through 2018.", "The nationally representative dataset included 30,000 adults aged 20 and older, each of whom completed two 24-hour dietary recalls.", "They then classified the additions into several categories, including dairy milk, half-and-half, dairy cream, non-dairy milk, non-dairy creamer, sugar/syrup, sugar substitutes, and other ingredients such as alcohol and cocoa powder.", "The analysis showed that Americans' overall coffee intake, including coffee consumed without additions, remained largely unchanged between 2003 and 2018.", "In 2018, dairy milk was the most commonly added ingredient by weight, averaging 21.4 grams per day.", "Non-dairy creamer followed at 8.1 grams per day, while sugar accounted for 4.4 grams per day."], "doi": ["10.1016/j.jand.2026.156908"], "sample": ["30,000 adults"], "journal_ref": "Journal Reference : Yongyi Pan, Bingjie Zhou, Fang Fang Zhang. Trends in the Consumption of Coffee and Coffee Additions Among U.S. Adults Aged 20 Years, The National Health and Nutrition Examination Survey 2003–2018 . Journal of the Academy of Nutrition and Dietetics , 2026; 156908 DOI: 10.1016/j.jand.2026.156908", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261021231224.htm"], "format": "SCALE", "catch": [], "score": 6, "why": ["형식 SCALE", "생활소재: coffee"]}, {"title": "A massive asteroid slammed into the North Sea and unleashed a 330-foot tsunami", "link": "https://www.sciencedaily.com/releases/2026/10/261020085727.htm", "key": "https://sciencedaily.com/releases/2026/10/261020085727.htm", "summary": "A decades-long mystery beneath the North Sea has finally been solved. Scientists have confirmed that the Silverpit Crater, buried 700 meters below the seabed, was created when a 160-meter-wide asteroid struck Earth roughly 43 to 46 million years ago. The violent collision blasted a towering curtain of rock and water 1.5 kilometers into the air and triggered a tsunami more than 100 meters high.", "date": "2026-10-21", "source": "ScienceDaily 전체", "first_seen": "2026-10-22", "facts": ["A massive asteroid slammed into the North Sea roughly 43 to 46 million years ago, triggering a tsunami more than 100 meters (330 feet) high.", "Although scientists first discovered it in 2002, its origins remained fiercely debated, with some researchers arguing that geological processes, rather than an object from space, were responsible.", "The Silverpit Crater lies approximately 700 meters beneath the seabed in the southern North Sea, about 80 miles off the coast of Yorkshire, England.", "The crater itself measures roughly three kilometers across and is surrounded by a much larger, 20-kilometer-wide region of circular faults, which are fractures in the rock where movement has occurred.", "When scientists first identified the formation in 2002, several features suggested that it had been created by a high-speed collision with an asteroid or comet.", "In 2009, geologists even voted on the competing explanations, as documented in Geoscientist magazine.", "Their results suggest that an asteroid approximately 160 meters across approached from the west and struck the seabed at a shallow angle.", "Nicholson said: \"Our evidence shows that a 160-meter-wide asteroid hit the seabed at a low angle from the west.", "\"Within minutes, it created a 1.5-kilometer-high curtain of rock and water that then collapsed into the sea, creating a tsunami over 100 meters high.\" That means the collision sent material nearly a mile into the air before it fell back into the sea, generating a tsunami taller than a 30-story building.", "Collins participated in the 2009 debate over Silverpit's origins and contributed the numerical simulations used in the new research."], "doi": ["10.1038/s41467-025-63985-z"], "sample": [], "journal_ref": "Journal Reference : Uisdean Nicholson, Iain de Jonge-Anderson, Alex Gillespie, Thomas Kenkmann, Tom Dunkley Jones, Gareth S. Collins, James Frankel, Veronica Bray, Sean P. S. Gulick, Ronnie Parr. Multiple lines of evidence for a hypervelocity impact origin for the Silverpit Crater . Nature Communications , 2025; 16 (1) DOI: 10.1038/s41467-025-63985-z", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261020085727.htm"], "format": "WEIGH", "catch": [], "score": 6, "why": ["형식 WEIGH", "훅: mystery"]}, {"title": "Too much RNA can starve cells of energy, scientists discover", "link": "https://www.sciencedaily.com/releases/2026/10/261020085023.htm", "key": "https://sciencedaily.com/releases/2026/10/261020085023.htm", "summary": "Scientists have uncovered an unexpected danger lurking inside cells: too much RNA can damage the structures responsible for producing energy. A new study found that excess RNA, including the normally essential messenger RNA (mRNA), can directly disrupt mitochondria without relying on the immune system. The discovery could help explain how viral infections and certain aging-related diseases damage cells.", "date": "2026-10-21", "source": "ScienceDaily 전체", "first_seen": "2026-10-22", "facts": ["Another type, double-stranded RNA (dsRNA), frequently appears during viral infections.", "Scientists already understood that excessive double-stranded RNA could provoke potentially harmful immune responses.", "\"Too much double-stranded RNA or mRNA that cannot be degraded effectively may contribute to disease processes in some contexts.\" Potential Implications for mRNA Vaccines and Future Treatments The discovery could also provide useful information for scientists developing medicines that rely on RNA.", "\"Scientists already knew that too much double-stranded RNA can be harmful,\" Yang said.", "\"What surprised us was finding out that too much mRNA -- something cells normally need every day -- can also damage mitochondria and interfere with the cell's ability to produce energy.\" Research reported in this study was supported, in part, by the National Institute of Allergy and Infectious Diseases (R01AI143709 to Z.Y.) and Texas A&M University.", "Antarctica’s “Doomsday Glacier” Could Raise Sea Levels Twice As Much as Scientists Feared Snakebites Are Far Deadlier Than We Thought, New Study Reveals Archaeologists May Have Just Discovered the World’s Oldest Shipwreck Researchers Find That Arthritis May Leave a Hidden Memory in Your Joints"], "doi": ["10.1073/pnas.2605194123"], "sample": [], "journal_ref": "Journal Reference : Djamal Brahim Belhaouari, Anil Pant, Santiago Navarro-Forero, Fernando Cantu, Zhilong Yang. Perturbation of RNA homeostasis impairs mitochondrial respiration during poxvirus infection through excess RNA accumulation . Proceedings of the National Academy of Sciences , 2026; 123 (22) DOI: 10.1073/pnas.2605194123", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261020085023.htm"], "format": "CUT", "catch": [], "score": 6, "why": ["형식 CUT", "훅: unexpected", "생활소재: aging"]}, {"title": "Scientists find 10 different diets linked to slower aging", "link": "https://www.sciencedaily.com/releases/2026/10/261019093439.htm", "key": "https://sciencedaily.com/releases/2026/10/261019093439.htm", "summary": "A study by DZNE finds that healthy eating is associated with slower biological aging—and that there is more than one way to eat healthily. The researchers examined ten dietary patterns considered healthy, including the Mediterranean, Nordic, and a plant-based diet, as well as the DASH diet, which is designed to help lower blood pressure. The findings are published in the journal Nature Communications.", "date": "2026-10-21", "source": "ScienceDaily 전체", "first_seen": "2026-10-22", "facts": ["A large study involving approximately 7,500 people suggests that eating a healthy diet may help slow biological aging, and there is no single eating plan that stands above all others.", "Scientists at the German Center for Neurodegenerative Diseases (DZNE) investigated 10 different dietary patterns, including the Mediterranean, Nordic, plant-based, and DASH diets.", "That is an encouraging finding, because it leaves room to tailor healthy eating to personal and cultural preferences, budget and taste.\" To investigate the connection between diet and aging, the scientists analyzed dietary information and blood samples from roughly 7,500 men and women.", "The initial analysis included 6,470 participants in DZNE's Rhineland Study in Bonn, Germany.", "The researchers then tested their findings using data from another 1,034 people enrolled in the EPIC-Potsdam Study, conducted by the German Institute of Human Nutrition Potsdam-Rehbrücke (DIfE).", "\"To this end, we leveraged state-of-the-art technology, which allowed us to cover about 850,000 sites in the DNA.", "This is roughly twice as many as in most previous studies.\" The next step was to determine how closely each participant followed the 10 dietary patterns.", "Better adherence to every one of the 10 diets was associated with slower biological aging.", "More than 70% of the affected pathways were shared across all 10 diets.", "\"More than 70 percent of the affected biological pathways were shared across all diets."], "doi": ["10.1038/s41467-026-77064-4"], "sample": ["1,034 people", "6,470 participants", "7,500 men", "7,500 people"], "journal_ref": "Journal Reference : Juliana F. Tavares, Dan Liu, Valentina Talevi, Fabian Eichelmann, Franziska Jannasch, Matthias B. Schulze, N. Ahmad Aziz, Ute Nöthlings, Monique M. B. Breteler. Associations between diet quality, epigenetic aging and epigenome in two population-based cohorts . Nature Communications , 2026; 17 (1) DOI: 10.1038/s41467-026-77064-4", "catch_extra": [], "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261019093439.htm"], "format": "SCALE", "catch": ["상관관계"], "score": 6, "why": ["형식 SCALE", "생활소재: diet, aging"]}, {"title": "A hidden bias in human language challenges 70 years of science", "link": "https://www.sciencedaily.com/releases/2026/10/261023023738.htm", "key": "https://sciencedaily.com/releases/2026/10/261023023738.htm", "summary": "A groundbreaking study challenges 70 years of assumptions about how human language works. By analyzing billions of word uses, scientists discovered that meaning is organized around power, danger, and order rather than emotion alone. Even more surprisingly, human language shows a powerful hidden preference for safety, suggesting that our words may reflect ancient survival instincts.", "date": "2026-10-24", "source": "ScienceDaily 전체", "first_seen": "2026-10-24", "sources": ["ScienceDaily 전체"], "links": ["https://www.sciencedaily.com/releases/2026/10/261023023738.htm"], "format": "CUT", "catch": [], "score": 6, "why": ["형식 CUT", "훅: surpris"], "doi": ["10.1126/sciadv.adr4039"], "journal_ref": "Journal Reference : Peter Sheridan Dodds, Thayer Alshaabi, Mikaela Irene Fudolig, Julia Witte Zimmerman, Juniper Lovato, Shawn Beaulieu, Joshua R. Minot, Michael V. Arnold, Andrew J. Reagan, Christopher M. Danforth. Ousiometrics: The essence of meaning aligns with a power-danger-structure framework instead of valence-arousal-dominance . Science Advances , 2026; 12 (19) DOI: 10.1126/sciadv.adr4039", "facts": ["Researchers at the University of Vermont have discovered a surprising pattern in human language that challenges a scientific theory widely accepted for more than 70 years.", "Since the 1950s, much of the scientific understanding of word meaning has relied on a framework developed through pioneering research by psychologist Charles Osgood and others.", "Their analysis examined billions of individual uses of more than 20,000 words across a wide range of real-world texts.", "The research, supported by the US National Science Foundation, Google, MassMutual, and other funders, found that this new framework accounted for more than 90% of the variation in measured word meaning.", "The traditional VAD approach explained approximately 72%.", "The researchers demonstrated that the ousiometer can analyze material from remarkably different sources, including Jane Austen's novels, Arthur Conan Doyle's Sherlock Holmes stories, the New York Times, Wikipedia, Twitter, and transcripts of talk radio programs.", "Antarctica’s “Doomsday Glacier” Could Raise Sea Levels Twice As Much as Scientists Feared Snakebites Are Far Deadlier Than We Thought, New Study Reveals Archaeologists May Have Just Discovered the World’s Oldest Shipwreck Researchers Find That Arthritis May Leave a Hidden Memory in Your Joints"], "sample": []}, {"title": "Wireless neural chip tracks brain changes in real time after Alzheimer's drug administration", "link": "https://medicalxpress.com/news/2026-10-wireless-neural-chip-tracks-brain.html", "key": "https://medicalxpress.com/news/2026-10-wireless-neural-chip-tracks-brain.html", "summary": "A joint research team led by KAIST has used a small, implantable neural chip to wirelessly monitor real-time changes in a neurotransmitter involved in memory and learning after an Alzheimer's drug has been administered. In miniature pigs (minipigs), the team observed an increase in the neurotransmitter signal following drug administration, followed by a gradual return to baseline. The technology could help researchers assess how drugs act in the brain and develop stimulation methods that adapt to the brain's response.", "date": "2026-10-27", "source": "MedicalXpress", "first_seen": "2026-10-27", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-wireless-neural-chip-tracks-brain.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-wireless-neural-chip-tracks-brain.html"], "format": "DOSE", "catch": ["동물 실험"], "score": 6, "why": ["형식 DOSE", "생활소재: memory, alzheimer, brain"]}, {"title": "Heart drug combo reduces kidney damage in septic shock surgery, major trial finds", "link": "https://medicalxpress.com/news/2026-10-heart-drug-combo-kidney-septic.html", "key": "https://medicalxpress.com/news/2026-10-heart-drug-combo-kidney-septic.html", "summary": "A simple adjustment to drugs given during operations for septic shock could prevent thousands of patients from suffering kidney damage, according to the results of a major trial now published in JAMA. Scientists from the University of Southampton working with experts from Zhejiang University School of Medicine in China discovered that combining the medications dobutamine and norepinephrine during surgery can significantly lower the risk of acute kidney injury.", "date": "2026-10-27", "source": "MedicalXpress", "first_seen": "2026-10-27", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-heart-drug-combo-kidney-septic.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-heart-drug-combo-kidney-septic.html"], "format": "DOSE", "catch": [], "score": 6, "why": ["형식 DOSE", "훅: shock"]}, {"title": "Omega-3 EPA linked to longer survival after surgery for colorectal cancer liver metastases", "link": "https://medicalxpress.com/news/2026-10-omega-epa-linked-longer-survival.html", "key": "https://medicalxpress.com/news/2026-10-omega-epa-linked-longer-survival.html", "summary": "Patients assigned to receive high-dose eicosapentaenoic acid (EPA), an omega-3 fatty acid, before and after surgery for colorectal cancer liver metastases had longer overall survival than those assigned to receive placebo, according to results of the phase 3 EMT2 trial presented at the ESMO Congress 2026, held in Madrid Oct. 23–27.", "date": "2026-10-26", "source": "MedicalXpress", "first_seen": "2026-10-27", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-omega-epa-linked-longer-survival.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-omega-epa-linked-longer-survival.html"], "format": "SCALE", "catch": ["상관관계"], "score": 6, "why": ["형식 SCALE"]}, {"title": "Fructose slows liver tumors in mice when key sugar-processing gene is missing, may lead to new treatments", "link": "https://medicalxpress.com/news/2026-10-fructose-liver-tumors-mice-key.html", "key": "https://medicalxpress.com/news/2026-10-fructose-liver-tumors-mice-key.html", "summary": "Fructose is an important nutrient that, despite having a chemical structure very similar to that of glucose, is metabolized very differently in the body. Research into fructose metabolism and its regulation of metabolism in the human body has in recent years become a frontier topic in the life sciences and medicine. A new study led by researchers at City University of Hong Kong (CityUHK) has found that in the specific metabolic context of hepatocellular carcinoma (HCC), dietary fructose does not fuel tumor growth. Instead, it can suppress it, revealing a previously unknown anticancer mechanism.", "date": "2026-10-27", "source": "MedicalXpress", "first_seen": "2026-10-27", "fetch_error": "403 Client Error: Forbidden for url: https://medicalxpress.com/news/2026-10-fructose-liver-tumors-mice-key.html", "catch_extra": [], "sources": ["MedicalXpress"], "links": ["https://medicalxpress.com/news/2026-10-fructose-liver-tumors- const BASE = location.pathname.includes('/weeks/') ? '../' : '';
const FORMATS = ['전체','CUT','PRESS','WEIGH','DOSE','SCALE'];
let fmt = '전체', q = '', hideSeen = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function header(){
  const opts = D.weeks.map(w => `<option value="${w}" ${w===D.week?'selected':''}>${w}</option>`).join('');
  document.getElementById('sub').innerHTML =
    `${D.week} 주 · ${D.updated} 갱신 · 최근 8일 ${D.total}건 → 상위 ${D.items.length}건 · 지난 주 보기 <select id="wk">${opts}</select>`;
  document.getElementById('wk').onchange = e => {
    const w = e.target.value; location.href = w === D.weeks[0] ? BASE + 'index.html' : BASE + 'weeks/' + w + '.html';
  };
  const bar = document.getElementById('bar');
  bar.innerHTML = FORMATS.map(f => `<button class="f ${f===fmt?'on':''}" data-f="${f}">${f}</button>`).join('') +
    `<input type="search" id="q" placeholder="검색 (mice, sleep …)" value="${esc(q)}">` +
    `<label><input type="checkbox" id="hs" ${hideSeen?'checked':''}>이미 본 소재 숨기기</label>`;
  bar.querySelectorAll('.f').forEach(b => b.onclick = () => { fmt = b.dataset.f; header(); render(); });
  document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  document.getElementById('hs').onchange = e => { hideSeen = e.target.checked; render(); };
}

function card(g, i){
  const chips = [];
  if (g.format) chips.push(`<span class="c fmt">${g.format}</span>`);
  (g.sample||[]).forEach(s => chips.push(`<span class="c">대상 ${esc(s)}</span>`));
  (g.catch||[]).forEach(s => chips.push(`<span class="c warn">${esc(s)}</span>`));
  if (g.seen) chips.push(`<span class="c seen">이미 본 소재 · ${esc(g.seen)}</span>`);
  if (g.sources.length > 1) chips.push(`<span class="c">${g.sources.length}곳 보도</span>`);
  const facts = (g.facts||[]).map(f => `<li>“${esc(f)}”</li>`).join('');
  const doi = (g.doi||[]).map(d => `<a href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">DOI ${esc(d)}</a>`).join('');
  return `<article class="card ${g.score>=12?'hot':''}">
    <div class="top"><div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><h2><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a></h2>
      <div class="meta">${esc(g.sources.join(' / '))} · ${esc(g.date)}</div></div>
      <div class="score">${g.score}<small>점수</small></div></div>
    <div class="chips">${chips.join('')}</div>
    <div class="sum">${esc(g.summary)}</div>
    ${facts ? `<details><summary>원문 속 숫자 문장 ${g.facts.length}개 (글자 그대로)</summary><ul>${facts}</ul></details>` : ''}
    ${g.journal_ref ? `<div class="why">논문: ${esc(g.journal_ref)}</div>` : ''}
    <div class="why">점수 이유: ${esc((g.why||[]).join(' · ') || '—')}</div>
    <div class="act"><button data-i="${i}">Claude에 보낼 문장 복사</button>${doi}</div>
  </article>`;
}

function render(){
  const rows = D.items.map((g,i) => [g,i]).filter(([g]) =>
    (fmt==='전체' || g.format===fmt) && (!hideSeen || !g.seen) &&
    (!q || (g.title+' '+g.summary).toLowerCase().includes(q)));
  const L = document.getElementById('list');
  L.innerHTML = rows.length ? rows.map(([g,i]) => card(g,i)).join('') : '<div class="empty">조건에 맞는 후보가 없어요</div>';
  L.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const g = D.items[+b.dataset.i];
    const t = `LAB GOSSIP ${D.week} 후보 #${+b.dataset.i+1}: ${g.title}\n${g.link}${g.doi&&g.doi.length?'\nDOI '+g.doi[0]:''}\n→ 이걸로 에피소드 만들자`;
    try { await navigator.clipboard.writeText(t); b.textContent='복사됨'; b.classList.add('done'); }
    catch(e){ prompt('복사해서 붙여넣으세요', t); }
  });
}

function status(){
  document.getElementById('status').innerHTML = '<tr><th>피드</th><th>결과</th></tr>' + D.status.map(s =>
    `<tr><td>${esc(s.feed)}</td><td>${s.ok ? `피드에 ${s.items}건 (${s.span_days ?? '?'}일치)` : `<span class="bad">실패</span> ${esc(s.error)}`}</td></tr>`).join('');
}
header(); render(); status();
</script>
</body>
</html>
