name: daily-collect

on:
  schedule:
    - cron: "17 23 * * *"   # 매일 08:17 (한국 시간) — 피드가 며칠치만 담고 있어서 매일 모아야 함
  workflow_dispatch: {}      # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collector/collect.py
      - name: save results
        run: |
          git config user.name "labgossip-bot"
          git config user.email "labgossip-bot@users.noreply.github.com"
          git add data docs
          git commit -m "weekly board $(date +%F)" || echo "nothing new"
          git push
